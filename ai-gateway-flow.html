<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Inference Gateway -- Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

/* Right Panel */
.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#58a6ff}
.flow-bar .start{border-color:#3fb950;color:#3fb950;min-width:90px}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:0 1 auto;overflow-y:auto;max-height:52%}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#58a6ff22;cursor:pointer;color:#58a6ff;transform:translateX(4px);border-left:2px solid #58a6ff;padding-left:6px}
body.light .step:hover{background:#ddf4ff88;cursor:pointer;color:#0969da;transform:translateX(4px);border-left:2px solid #0969da;padding-left:6px}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending{color:#484f58}
body.light .step.pending{color:#b0b8c1}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#58a6ff}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}
.step .step-mk::before{content:'\25CB'}

.insp-section{flex:1;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif;flex-shrink:0;padding:0 0 6px;border-bottom:1px solid #30363d}
body.light .insp-title{border-color:#d0d7de}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6;transition:all .4s}
.insp-line.add{background:#1a2e1a;color:#3fb950;border-left:3px solid #3fb950}
body.light .insp-line.add{background:#dafbe1;color:#116329}
.insp-line.del{background:#2d1517;color:#f85149;text-decoration:line-through;opacity:.7;border-left:3px solid #f85149}
body.light .insp-line.del{background:#ffebe9;color:#82071e}
.insp-line.keep{color:#8b949e;border-left:3px solid transparent}
.insp-line.highlight{background:#1a2332;color:#58a6ff;border-left:3px solid #58a6ff;animation:pulse .8s}
body.light .insp-line.highlight{background:#ddf4ff;color:#0969da}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:1}}
.insp-plugin{margin:8px 0 4px;padding:4px 8px;background:#d2a8ff22;border-radius:4px;color:#d2a8ff;font-weight:600;font-size:12px;font-family:-apple-system,sans-serif}
body.light .insp-plugin{background:#8250df15;color:#8250df}

/* Theme toggle — top-left corner */
.theme-toggle{position:fixed;top:16px;left:16px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

/* Gradient title */
.viz-title{position:fixed;top:14px;left:0;right:380px;z-index:200;text-align:center;font-size:22px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#d2a8ff,#f0883e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;pointer-events:none}

/* Legend */
.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;transition:all .3s}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

/* Scrollbar */
.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-track,.insp-section::-webkit-scrollbar-track{background:transparent}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-section::-webkit-scrollbar-thumb,body.light .insp-section::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>

<button class="theme-toggle" id="thm" onclick="toggleTheme()">&#9790;</button>
<div class="viz-title">AI Inference Gateway &mdash; Flow Visualizer <span id="flow-label" style="font-weight:700;-webkit-text-fill-color:#f0883e"></span></div>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flow-select">
      <option value="ext">External Model (Anthropic)</option>
      <option value="inc">Internal Model (llm-d)</option>
      <option value="auth">Auth Failure (401)</option>
      <option value="rl">Rate Limit (429)</option>
    </select>
    <button class="start" onclick="run()">&#9654; Start</button>
    <button id="speed-btn" onclick="cycleSpeed()" style="min-width:36px">1x</button>
    <button id="loop-btn" onclick="toggleLoop()" style="border-color:#79c0ff;color:#79c0ff">&#8635; Loop</button>
    <button class="rst" onclick="doReset()">Reset</button>
  </div>
  <div class="steps-section" id="steps-section">
    <div class="steps-title">Flow Steps <span style="font-weight:400;font-size:11px;color:#8b949e">· click to jump</span></div>
    <div id="steps-ctr"></div>
  </div>
  <div class="insp-section" id="insp-section">
    <div class="insp-title">Request Inspector</div>
    <div id="insp-content"></div>
  </div>
</div>

<div id="info-panel" style="position:fixed;bottom:16px;left:180px;right:400px;z-index:100;padding:10px 16px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;color:#8b949e;opacity:0.6;transition:all .3s;min-height:40px">Click a component to see details</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Auth / Rate Limit</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>IPP Container</div>
  <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(90deg,#58a6ff,#3fb950);border-radius:50%"></div>Req / Resp Plugins</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, isDark = true, animFrame = null, dots = [], activeNodes = new Set(), currentStepDone = 0;
let badges = {}, lines = [], running = false, glowing = new Set(), fading = {};
let paused = false, runStepIndex = 0, stepTimer = null, playbackSpeed = 1, loopMode = false;
let inspHeaders = [], inspBody = [], inspCycle = [], inspStepLabel = '';
let snapshots = []; // State snapshot after each step completes

// Logical canvas dimensions
const LW = 1200, LH = 1050;
let ox = 0, oy = 0, sc = 1;

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('thm').innerHTML = isDark ? '&#9790;' : '&#9788;';
  draw();
}

// ================================================================
// NODES
// ================================================================
const N = {
  user: { x: 5, y: 155, w: 80, h: 50, label: 'Client / Agent', type: 'icon' },

  cluster: { x: 120, y: 80, w: 1070, h: 960, type: 'boundary' },
  aigw: { x: 155, y: 115, w: 1010, h: 740, type: 'container', label: 'AI Inference Gateway', color: '#58a6ff' },

  gw: { x: 250, y: 140, w: 700, h: 80, label: 'Istio Gateway', sublabel: '(Envoy)', color: '#58a6ff', fs: 20 },

  wasm: { x: 190, y: 305, w: 300, h: 280, type: 'container', label: 'Kuadrant Wasm Shim', color: '#f0883e' },
  auth: { x: 215, y: 360, w: 250, h: 60, label: 'Auth', sublabel: '(Authorino)', color: '#f0883e', fs: 16, inner: true },
  rlimit: { x: 215, y: 445, w: 250, h: 60, label: 'Rate Limit', sublabel: '(Limitador)', color: '#f0883e', fs: 16, inner: true },

  ipp: { x: 740, y: 260, w: 380, h: 460, type: 'container', label: 'Payload Processor / IPP (ext_proc)', color: '#d2a8ff' },
  // Request plugins
  p_rguard:  { x: 770, y: 318, w: 320, h: 40, label: 'request-guard (nemo)', color: '#58a6ff', type: 'plugin', inner: true, fs: 14, soon: true },
  p_ims:     { x: 770, y: 360, w: 320, h: 40, label: 'intelligent-model-selection', color: '#58a6ff', type: 'plugin', inner: true, fs: 12, soon: true },
  p_mpr:     { x: 770, y: 402, w: 320, h: 36, label: 'model-provider-resolver', color: '#58a6ff', type: 'plugin', inner: true, fs: 14 },
  p_bfth:    { x: 770, y: 440, w: 320, h: 36, label: 'body-field-to-header', color: '#58a6ff', type: 'plugin', inner: true, fs: 14 },
  p_at_req:  { x: 770, y: 478, w: 320, h: 36, label: 'api-translation', sublabel: '(request)', color: '#58a6ff', type: 'plugin', inner: true, fs: 14 },
  p_aki:     { x: 770, y: 518, w: 320, h: 36, label: 'apikey-injection', color: '#58a6ff', type: 'plugin', inner: true, fs: 14 },
  // Response plugins
  p_at_resp: { x: 770, y: 595, w: 320, h: 36, label: 'api-translation', sublabel: '(response)', color: '#3fb950', type: 'plugin', inner: true, fs: 14 },
  p_resp_guard: { x: 770, y: 633, w: 320, h: 40, label: 'response-guard (nemo)', color: '#3fb950', type: 'plugin', inner: true, fs: 14, soon: true },

  // External models — far left, outside cluster
  openai:    { x: 0, y: 310, w: 120, h: 55, label: 'OpenAI',       sublabel: 'gpt-4o-mini',      color: '#3fb950', fs: 14 },
  anthropic: { x: 0, y: 375, w: 120, h: 55, label: 'Anthropic',    sublabel: 'claude-haiku-4-5',  color: '#3fb950', fs: 14 },
  azure:     { x: 0, y: 440, w: 120, h: 55, label: 'Azure OpenAI', sublabel: 'gpt-4.1-mini',     color: '#3fb950', fs: 13 },
  bedrock:   { x: 0, y: 505, w: 120, h: 55, label: 'Bedrock',      sublabel: 'claude-3-haiku',   color: '#3fb950', fs: 14 },
  vertex:    { x: 0, y: 570, w: 120, h: 55, label: 'Vertex AI',    sublabel: 'gemini-2.5-flash', color: '#3fb950', fs: 14 },

  // MaaS API — centered with Kuadrant height, between Kuadrant and IPP
  maas: { x: 230, y: 640, w: 220, h: 55, label: 'MaaS API', sublabel: 'key validation', color: '#79c0ff', fs: 15 },

  // llm-d Scheduler / EPP — centered under all components
  epp: { x: 460, y: 760, w: 260, h: 70, type: 'container', label: 'llm-d Scheduler / EPP (ext_proc)', color: '#79c0ff' },
  sched: { x: 490, y: 782, w: 200, h: 40, label: 'Endpoint Picker', sublabel: 'Pod Selection', color: '#79c0ff', fs: 14, inner: true },

  pool: { x: 140, y: 870, w: 1040, h: 175, type: 'boundary', label: 'InferencePool' },
  sidecar: { x: 210, y: 890, w: 130, h: 38, label: 'Sidecar', color: '#8b949e', fs: 14 },
  decode:  { x: 180, y: 945, w: 200, h: 60, label: 'vLLM', sublabel: 'Decode Pod A', color: '#d2a8ff', fs: 16 },
  nixl:    { x: 480, y: 950, w: 240, h: 50, label: 'NIXL', sublabel: 'KV Transfer (KVXfer)', color: '#8b949e', fs: 14 },
  prefill: { x: 830, y: 945, w: 200, h: 60, label: 'vLLM', sublabel: 'Prefill Pod B', color: '#d2a8ff', fs: 16 },
};

const tips = {
  gw:      'Envoy-based gateway that receives all inference requests. Runs Kuadrant Wasm filter for auth/rate-limiting and ext_proc filter for payload processing. Routes to upstream providers or on-cluster models.',
  p_rguard:'(Coming soon) NVIDIA NeMo Guardrails — request safety check. Evaluates content policies on the incoming request before any processing. Can block requests that violate safety policies.',
  p_mpr:   'Uses a Kubernetes reconciler to watch ExternalModel CRDs. Resolves the model name to a provider (openai, anthropic, etc.), target model ID, and endpoint. Stores results in CycleState for downstream plugins.',
  p_bfth:  'Extracts the "model" field from the JSON request body and sets it as the X-Gateway-Model-Name HTTP header. This enables model-based routing without parsing the body in Envoy.',
  p_at_req:'Request direction: translates OpenAI Chat Completions format to provider-native API (e.g., Anthropic Messages API). Handles path rewriting (/v1/chat/completions → /v1/messages), header mutations, and body transformation.',
  p_aki:   'Reads the provider API key from a Kubernetes Secret (labeled inference.networking.k8s.io/bbr-managed) and injects the appropriate auth header — Authorization: Bearer for OpenAI, x-api-key for Anthropic, api-key for Azure.',
  p_ims:   '(Coming soon) Intelligent model selection — automatically selects the optimal model based on request characteristics, cost, latency, and availability.',
  p_at_resp:'Response direction: translates provider-native response back to OpenAI Chat Completions format. Converts Anthropic content array to choices, stop_reason to finish_reason, and normalizes usage tokens.',
  p_resp_guard:'(Coming soon) NVIDIA NeMo Guardrails — response safety check. Evaluates content policies on the provider response (after api-translation converts it to OpenAI format). Can block responses that violate safety policies.',
  auth:    'Authorino auth server called via gRPC from the Wasm shim. Validates the MaaS API key by calling MaaS API internally at /internal/v1/api-keys/validate. Also resolves subscription info and injects X-MaaS-Username header.',
  rlimit:  'Limitador rate-limit server called via gRPC from the Wasm shim. Implements token-based rate limiting via TokenRateLimitPolicy. On request: checks if quota allows. On response: reads usage.total_tokens and reports consumed tokens.',
  maas:    'MaaS API server that manages API keys, subscriptions, and model listings. Called by Authorino during auth validation. Stores keys in PostgreSQL. Provides /v1/models and /v1/api-keys endpoints.',
  epp:     'llm-d Scheduler — an ext_proc filter like IPP. Runs the Endpoint Picker Proxy (EPP) to select the optimal pod for inference. Part of the AI Inference Gateway.',
  sched:   'Endpoint Picker selects the optimal pod for disaggregated serving — routes to Prefill or Decode variants based on KV cache utilization, queue depth, and model affinity.',
  sidecar: 'Sidecar proxy coordinates the P/D disaggregation transaction. Receives the request, communicates with the prefill worker IP, and orchestrates the KV cache transfer.',
  prefill: 'Prefill Pod B. Processes the input prompt and generates the initial KV cache. Returns KVXfer metadata to enable the decode pod to pull the KV cache via NIXL.',
  decode:  'Decode Pod A. Generates output tokens auto-regressively. Pulls KV cache from the prefill pod using KVXfer metadata via NIXL high-speed interconnect.',
  nixl:    'NIXL (NVIDIA Inference Xfer Library). High-speed KV cache transfer between prefill and decode pods. Decode pulls KVs using KVXfer metadata over GPU-direct RDMA or DCN.',
  anthropic: 'Anthropic Claude API endpoint. Receives requests translated from OpenAI format to Anthropic Messages API format (/v1/messages). Response is translated back to OpenAI format by the api-translation plugin.',
  openai:  'OpenAI API endpoint. Requests pass through without format translation (native OpenAI format). Only credential injection is applied.',
  azure:   'Azure OpenAI endpoint. Similar to OpenAI but uses api-key header instead of Authorization: Bearer. Content filter fields are stripped from responses.',
  bedrock: 'AWS Bedrock Mantle endpoint (OpenAI-compatible). Uses the /v1/chat/completions path. Credential is base64-encoded access key.',
  vertex:  'Google Vertex AI endpoint (OpenAI-compatible). Path is rewritten to /v1beta1/projects/{project}/locations/{location}/endpoints/openapi/chat/completions.',
};

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', boxA:'#1a2332', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e', brt:'#fff' }
    : { bg:'#fff', box:'#f6f8fa', boxA:'#ddf4ff', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76', brt:'#000' };
}

// ================================================================
// DRAWING
// ================================================================
function resize() {
  const panelW = 380;
  W = canvas.width = innerWidth - panelW;
  H = canvas.height = innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.92;
  ox = (W - LW * sc) / 2;
  oy = (H - LH * sc) * 0.04;
  draw();
}
addEventListener('resize', resize);

function tx(x) { return ox + x * sc; }
function ty(y) { return oy + y * sc; }
function ts(s) { return s * sc; }

function drawBox(key) {
  const n = N[key], c = C();
  if (!n || n.type === 'boundary' || n.type === 'container') return;
  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h);
  const isA = activeNodes.has(key), hasBadge = badges[key] != null;
  ctx.save();

  if (n.type === 'icon') {
    ctx.font = `${ts(32)}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F464}', x + w / 2, y + ts(26));
    ctx.font = `bold ${ts(16)}px system-ui`;
    ctx.fillStyle = c.txt;
    ctx.fillText(n.label, x + w / 2, y + ts(46));
    ctx.restore();
    return;
  }

  let fadeA = 1;
  if (fading[key]) {
    const el = Date.now() - fading[key];
    fadeA = Math.min(el / 500, 1);
    if (el > 500) delete fading[key];
  }

  if (isA || hasBadge) {
    ctx.shadowColor = n.color;
    ctx.shadowBlur = ts(18) * fadeA;
    ctx.globalAlpha = 0.3 + 0.7 * fadeA;
  }

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, ts(8));
  ctx.fillStyle = (isA || hasBadge) ? c.boxA : c.box;
  ctx.fill();
  ctx.strokeStyle = (isA || hasBadge) ? n.color : c.bdr;
  ctx.lineWidth = ts((isA || hasBadge) ? 2.5 : 1.5);
  if (n.type === 'plugin') { ctx.setLineDash([ts(5), ts(4)]); }
  ctx.stroke();
  ctx.setLineDash([]);

  const fs = n.fs || 16;
  ctx.fillStyle = c.txt;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (n.soon && !n.sublabel) {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2 - ts(6));
    ctx.font = `bold ${ts(9)}px system-ui`;
    ctx.fillStyle = '#f0883e';
    ctx.fillText('COMING SOON', x + w / 2, y + h / 2 + ts(8));
  } else if (n.sublabel) {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2 - ts(8));
    ctx.font = `${ts(Math.max(fs - 3, 11))}px system-ui`;
    ctx.fillStyle = c.dim;
    if (n.soon) {
      ctx.fillText(n.sublabel, x + w / 2, y + h / 2 + ts(6));
      ctx.font = `bold ${ts(8)}px system-ui`;
      ctx.fillStyle = '#f0883e';
      ctx.fillText('COMING SOON', x + w / 2, y + h / 2 + ts(16));
    } else {
      ctx.fillText(n.sublabel, x + w / 2, y + h / 2 + ts(8));
    }
  } else {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2);
  }

  // Badges
  if (hasBadge) {
    const bList = Array.isArray(badges[key]) ? badges[key] : [badges[key]];
    bList.forEach((bNum, idx) => {
      const bx = x + ts(8) + idx * ts(22), by = y + ts(5), br = ts(9);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(bx + br, by + br, br, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.fill();
      ctx.font = `bold ${ts(10)}px system-ui`;
      ctx.fillStyle = isDark ? '#0d1117' : '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(bNum), bx + br, by + br);
    });
  }
  ctx.restore();
}

function drawContainer(key, isGlow) {
  const n = N[key], c = C();
  if (!n || n.type !== 'container') return;
  ctx.save();
  if (isGlow) { ctx.shadowColor = n.color; ctx.shadowBlur = ts(22); }
  ctx.beginPath();
  ctx.roundRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h), ts(10));
  const a = isGlow ? 'cc' : '55';
  ctx.strokeStyle = n.color + a;
  ctx.lineWidth = ts(isGlow ? 3 : 2.5);
  ctx.setLineDash([ts(7), ts(5)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `bold ${ts(12)}px system-ui`;
  ctx.fillStyle = n.color + (isDark ? 'aa' : '99');
  ctx.textAlign = 'left';
  ctx.fillText(n.label, tx(n.x + 12), ty(n.y + 18));
  ctx.restore();
}

function drawBounds() {
  const c = C();
  // Cluster boundary
  const cb = N.cluster;
  ctx.beginPath();
  ctx.roundRect(tx(cb.x), ty(cb.y), ts(cb.w), ts(cb.h), ts(14));
  ctx.strokeStyle = c.bdr;
  ctx.lineWidth = ts(2.5);
  ctx.setLineDash([ts(10), ts(8)]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.lineWidth = ts(1.5);
  ctx.setLineDash([ts(5), ts(4)]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Stacked vLLM pods behind decode (decorative)
  const podC = isDark ? '#d2a8ff18' : '#d2a8ff12';
  const podS = isDark ? '#d2a8ff44' : '#d2a8ff33';

    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function edgePt(n, targetX, targetY, yOff) {
  const cx_ = n.x + n.w / 2, cy_ = n.y + n.h / 2;
  const dx = targetX - cx_, dy = targetY - cy_;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return { x: cx_, y: cy_ };
  const hw = n.w / 2, hh = n.h / 2;
  let ex, ey;
  if (Math.abs(dx) * hh > Math.abs(dy) * hw) {
    ex = cx_ + (dx > 0 ? hw : -hw);
    ey = cy_ + dy * (hw / Math.abs(dx));
  } else {
    ey = cy_ + (dy > 0 ? hh : -hh);
    ex = cx_ + dx * (hh / Math.abs(dy));
  }
  return { x: ex, y: ey + (yOff || 0) };
}

function drawArrowLine(x1, y1, x2, y2, color, num, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.beginPath();
  ctx.moveTo(tx(x1), ty(y1));
  ctx.lineTo(tx(x2), ty(y2));
  ctx.strokeStyle = color;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1), sz = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2) - sz * Math.cos(ang - 0.4), ty(y2) - sz * Math.sin(ang - 0.4));
  ctx.lineTo(tx(x2) - sz * Math.cos(ang + 0.4), ty(y2) - sz * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (num != null) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, r = ts(12);
    ctx.beginPath();
    ctx.arc(tx(mx), ty(my), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), tx(mx), ty(my));
  }
  ctx.restore();
}

function drawLines() {
  lines.forEach(l => {
    const fn = N[l.from], tn = N[l.to];
    if (!fn || !tn) return;
    if (l.waypoints) {
      const fp = resolveEdge(fn, l, true);
      const tp = resolveEdge(tn, l, false);
      const pts = [fp, ...l.waypoints, tp];
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.moveTo(tx(pts[0].x), ty(pts[0].y));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(tx(pts[i].x), ty(pts[i].y));
      ctx.strokeStyle = l.color;
      ctx.lineWidth = ts(2.5);
      ctx.stroke();
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const ang = Math.atan2(last.y - prev.y, last.x - prev.x), sz = ts(10);
      ctx.beginPath();
      ctx.moveTo(tx(last.x), ty(last.y));
      ctx.lineTo(tx(last.x) - sz * Math.cos(ang - 0.4), ty(last.y) - sz * Math.sin(ang - 0.4));
      ctx.lineTo(tx(last.x) - sz * Math.cos(ang + 0.4), ty(last.y) - sz * Math.sin(ang + 0.4));
      ctx.closePath();
      ctx.fillStyle = l.color;
      ctx.fill();
      if (l.num != null) {
        const mid = pts[Math.floor(pts.length / 2)];
        const r = ts(12);
        ctx.beginPath();
        ctx.arc(tx(mid.x), ty(mid.y), r, 0, Math.PI * 2);
        ctx.fillStyle = l.color;
        ctx.fill();
        ctx.font = `bold ${ts(10)}px system-ui`;
        ctx.fillStyle = isDark ? '#0d1117' : '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(l.num), tx(mid.x), ty(mid.y));
      }
      ctx.restore();
    } else {
      let fp = resolveEdge(fn, l, true);
      let tp = resolveEdge(tn, l, false);
      // Fall back to auto edge if no specific direction
      if (!l.fromLeft && !l.fromRight && !l.fromBottom && !l.fromTop) {
        const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
        fp = edgePt(fn, tc, tcy, l.yOff || 0);
      }
      if (!l.toLeft && !l.toRight && !l.toBottom && !l.toTop) {
        const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
        tp = edgePt(tn, fc, fy, l.yOff || 0);
      }
      drawArrowLine(fp.x, fp.y, tp.x, tp.y, l.color, l.num, 0.8);
    }
  });
}

function resolveEdge(n, l, isFrom) {
  const yo = l.yOff || 0;
  if (isFrom) {
    if (l.fromLeft) return { x: n.x, y: n.y + n.h / 2 + yo };
    if (l.fromRight) return { x: n.x + n.w, y: n.y + n.h / 2 + yo };
    if (l.fromBottom) return { x: n.x + n.w / 2 + (l.fromXOff || l.xOff || 0), y: n.y + n.h + yo };
    if (l.fromTop) return { x: n.x + n.w / 2 + (l.fromXOff || 0), y: n.y + yo };
    if (l.waypoints) return edgePt(n, l.waypoints[0].x, l.waypoints[0].y, yo);
    return { x: n.x + n.w / 2, y: n.y + n.h / 2 + yo };
  } else {
    if (l.toLeft) return { x: n.x, y: n.y + n.h / 2 + yo };
    if (l.toTop) return { x: n.x + n.w / 2 + (l.toXOff || l.xOff || 0), y: n.y + yo };
    if (l.toRight) return { x: n.x + n.w, y: n.y + n.h / 2 + yo };
    if (l.toBottom) return { x: n.x + n.w / 2 + (l.toXOff || 0), y: n.y + n.h + yo };
    if (l.waypoints) { const wp = l.waypoints; return edgePt(n, wp[wp.length - 1].x, wp[wp.length - 1].y, yo); }
    return { x: n.x + n.w / 2, y: n.y + n.h / 2 + yo };
  }
}

// ANIMATED DOT
// ================================================================
class Dot {
  constructor(fKey, tKey, color, speed, cb, opts) {
    this.color = color;
    this.speed = speed || 0.012;
    this.t = 0;
    this.cb = cb;
    this.alive = true;
    const fn = N[fKey], tn = N[tKey];
    const yo = (opts && opts.yOff) || 0;
    let fp, tp;

    const lo = opts || {};
    fp = resolveEdge(fn, lo, true);
    tp = resolveEdge(tn, lo, false);
    // If no specific edge direction was set, fall back to auto edge calculation
    if (!lo.fromLeft && !lo.fromRight && !lo.fromBottom && !lo.fromTop && !lo.waypoints) {
      const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
      fp = edgePt(fn, tc, tcy, yo);
    }
    if (!lo.toLeft && !lo.toRight && !lo.toBottom && !lo.toTop && !lo.waypoints) {
      const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
      tp = edgePt(tn, fc, fy, yo);
    }
    if (opts && opts.waypoints) {
      this.pts = [fp, ...opts.waypoints, tp];
    } else {
      this.pts = [fp, tp];
    }

    this.segLens = [];
    this.totalLen = 0;
    for (let i = 1; i < this.pts.length; i++) {
      const dx = this.pts[i].x - this.pts[i - 1].x, dy = this.pts[i].y - this.pts[i - 1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      this.segLens.push(len);
      this.totalLen += len;
    }
    this.segIdx = 0;
    this.x = this.pts[0].x;
    this.y = this.pts[0].y;
  }
  update() {
    this.t += this.speed;
    if (this.t >= 1) { this.t = 1; this.alive = false; if (this.cb) this.cb(); }
    const dist = this.t * this.totalLen;
    let accum = 0;
    for (let i = 0; i < this.segLens.length; i++) {
      if (accum + this.segLens[i] >= dist) {
        const segT = (dist - accum) / this.segLens[i];
        this.x = this.pts[i].x + (this.pts[i + 1].x - this.pts[i].x) * segT;
        this.y = this.pts[i].y + (this.pts[i + 1].y - this.pts[i].y) * segT;
        this.segIdx = i;
        return;
      }
      accum += this.segLens[i];
    }
    const last = this.pts[this.pts.length - 1];
    this.x = last.x;
    this.y = last.y;
    this.segIdx = this.segLens.length - 1;
  }
  posAt(t) {
    const dist = Math.max(0, Math.min(1, t)) * this.totalLen;
    let accum = 0;
    for (let i = 0; i < this.segLens.length; i++) {
      if (accum + this.segLens[i] >= dist) {
        const segT = (dist - accum) / this.segLens[i];
        return { x: this.pts[i].x + (this.pts[i + 1].x - this.pts[i].x) * segT,
                 y: this.pts[i].y + (this.pts[i + 1].y - this.pts[i].y) * segT };
      }
      accum += this.segLens[i];
    }
    const last = this.pts[this.pts.length - 1];
    return { x: last.x, y: last.y };
  }
  draw() {
    ctx.save();
    // Progressive trail — only behind the packet
    ctx.beginPath();
    ctx.moveTo(tx(this.pts[0].x), ty(this.pts[0].y));
    for (let i = 0; i < this.segIdx; i++) ctx.lineTo(tx(this.pts[i + 1].x), ty(this.pts[i + 1].y));
    ctx.lineTo(tx(this.x), ty(this.y));
    ctx.strokeStyle = this.color;
    ctx.lineWidth = ts(2);
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    // Trailing data stream — small dots behind the leading packet
    for (let j = 4; j >= 1; j--) {
      const bt = this.t - j * 0.06;
      if (bt <= 0) continue;
      const p = this.posAt(bt);
      ctx.globalAlpha = 0.15 + (1 - j / 4) * 0.4;
      ctx.beginPath();
      ctx.arc(tx(p.x), ty(p.y), ts(2.5), 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
    // Leading packet — pentagon shape oriented along travel direction
    ctx.globalAlpha = 1;
    const si = Math.min(this.segIdx, this.pts.length - 2);
    const ang = Math.atan2(this.pts[si + 1].y - this.pts[si].y, this.pts[si + 1].x - this.pts[si].x);
    ctx.save();
    ctx.translate(tx(this.x), ty(this.y));
    ctx.rotate(ang);
    const pw = ts(13), ph = ts(7);
    ctx.beginPath();
    ctx.moveTo(pw / 2, 0);
    ctx.lineTo(pw / 6, -ph / 2);
    ctx.lineTo(-pw / 2, -ph / 2);
    ctx.lineTo(-pw / 2, ph / 2);
    ctx.lineTo(pw / 6, ph / 2);
    ctx.closePath();
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = ts(16);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}

function inspStep(stepNum) {

    inspStepAuth(stepNum);
    renderInsp();
    return;
  }
  if (stepNum >= 7 && activeFlow === 'rl') {
    inspStepRL(stepNum);

// ================================================================
// RUN / RESET
// ================================================================
function updatePlayBtn() {
  const btn = document.querySelector('.start');
  if (paused) btn.innerHTML = '&#9654; Resume';
  else if (running) btn.innerHTML = '&#9646;&#9646; Pause';
  else btn.innerHTML = '&#9654; Start';
}

function cycleSpeed() {
  const speeds = [0.5, 1, 2];
  const idx = speeds.indexOf(playbackSpeed);
  playbackSpeed = speeds[(idx + 1) % speeds.length];
  document.getElementById('speed-btn').textContent = playbackSpeed + 'x';
}

function toggleLoop() {
  loopMode = !loopMode;
  const btn = document.getElementById('loop-btn');
  btn.style.background = loopMode ? (isDark ? '#79c0ff22' : '#79c0ff18') : 'transparent';
  btn.textContent = loopMode ? '⟳ Loop ON' : '⟳ Loop';
  if (loopMode && !running && !paused) run();
}

function stepOpts(s) {
  return {
    fromLeft: s.fromLeft, toLeft: s.toLeft, fromRight: s.fromRight, toRight: s.toRight,
    fromBottom: s.fromBottom, fromTop: s.fromTop, toTop: s.toTop, toBottom: s.toBottom,
    yOff: s.yOff, xOff: s.xOff, fromXOff: s.fromXOff, toXOff: s.toXOff, waypoints: s.waypoints
  };
}

function stepLine(s) {
  return {
    from: s.f, to: s.to, color: s.c, num: s.num,
    fromLeft: s.fromLeft, toLeft: s.toLeft, fromRight: s.fromRight, toRight: s.toRight,
    fromBottom: s.fromBottom, fromTop: s.fromTop, toTop: s.toTop, toBottom: s.toBottom,
    yOff: s.yOff, xOff: s.xOff, fromXOff: s.fromXOff, toXOff: s.toXOff, waypoints: s.waypoints
  };
}

function run() {
  if (paused) {
    paused = false;
    running = true;
    updatePlayBtn();
    if (!animFrame) animate();
    stepTimer = setTimeout(execStep, 300 / playbackSpeed);
    return;
  }
  if (running) {
    paused = true;
    running = false;
    if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
    updatePlayBtn();
    return;
  }
  doReset();
  running = true;
  paused = false;
  runStepIndex = 0;
  currentStepDone = 0;
  initInspector();
  updatePlayBtn();
  stepTimer = setTimeout(execStep, 300);
  if (!animFrame) animate();
}

function execStep() {
  if (!running || paused || runStepIndex >= flow.length) {
    if (runStepIndex >= flow.length) {
      running = false; paused = false; updatePlayBtn();
      if (loopMode) {
        stepTimer = setTimeout(() => {
          const idx = flowOrder.indexOf(activeFlow);
          activeFlow = flowOrder[(idx + 1) % flowOrder.length];
          flow = flowMap[activeFlow];
          document.getElementById('flow-select').value = activeFlow;
          updateTitle();
          doReset(); run();
        }, 3000 / playbackSpeed);
      }
    }
    return;
  }
  const si = runStepIndex;
  const s = flow[si];
  for (let j = 0; j < si; j++) {
    const prev = document.getElementById('step-' + j);
    if (prev) prev.className = 'step done';
  }
  const el = document.getElementById('step-' + si);
  el.className = 'step active';
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  inspStep(si + 1);

  if (s.mode === 'arrow') {
    if (s.f) activeNodes.add(s.f);
    dots.push(new Dot(s.f, s.to, s.c, 0.02 * playbackSpeed, () => {
      lines.push(stepLine(s));
      if (s.glow) glowing.add(s.glow);
      activeNodes.add(s.to);
      el.className = 'step done';
      currentStepDone = si + 1;
      saveSnapshot(si);
      runStepIndex++;
      if (running && !paused) {
        stepTimer = setTimeout(execStep, 300 / playbackSpeed);
      }
    }, stepOpts(s)));
  } else if (s.mode === 'lightup') {
    fading[s.target] = Date.now();
    activeNodes.add(s.target);
    if (s.errColor) N[s.target]._origColor = N[s.target]._origColor || N[s.target].color, N[s.target].color = s.errColor;
    if (badges[s.target] != null) {
      const existing = Array.isArray(badges[s.target]) ? badges[s.target] : [badges[s.target]];
      existing.push(s.badge);
      badges[s.target] = existing;
    } else {
      badges[s.target] = s.badge;
    }
    el.className = 'step done';
    currentStepDone = si + 1;
    saveSnapshot(si);
    runStepIndex++;
    if (running && !paused) {
      stepTimer = setTimeout(execStep, 800 / playbackSpeed);
    }
  }
}

function saveSnapshot(stepIdx) {
  snapshots[stepIdx] = {
    activeNodes: new Set(activeNodes),
    badges: JSON.parse(JSON.stringify(badges)),
    lines: JSON.parse(JSON.stringify(lines)),
    glowing: new Set(glowing),
  };
}

function restoreSnapshot(stepIdx) {
  if (stepIdx < 0) {
    activeNodes.clear(); badges = {}; lines = []; glowing.clear();
    return;
  }
  const snap = snapshots[stepIdx];
  if (!snap) return;
  activeNodes = new Set(snap.activeNodes);
  badges = JSON.parse(JSON.stringify(snap.badges));
  lines = JSON.parse(JSON.stringify(snap.lines));
  glowing = new Set(snap.glowing);
}

function simulateUpTo(targetStep) {
  activeNodes.clear(); badges = {}; lines = []; glowing.clear();
  for (let i = 0; i <= targetStep; i++) {
    const s = flow[i];
    if (s.mode === 'arrow') {
      if (s.f) activeNodes.add(s.f);
      lines.push(stepLine(s));
      if (s.glow) glowing.add(s.glow);
      activeNodes.add(s.to);
    } else if (s.mode === 'lightup') {
      activeNodes.add(s.target);
      if (s.errColor) N[s.target]._origColor = N[s.target]._origColor || N[s.target].color, N[s.target].color = s.errColor;
      if (badges[s.target] != null) {
        const existing = Array.isArray(badges[s.target]) ? badges[s.target] : [badges[s.target]];
        existing.push(s.badge);
        badges[s.target] = existing;
      } else {
        badges[s.target] = s.badge;
      }
    }
    saveSnapshot(i);
  }
}

function jumpToStep(targetStep) {
  if (running) {
    running = false;
    if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
  }
  if (!snapshots[targetStep]) simulateUpTo(targetStep);
  restoreSnapshot(targetStep);
  currentStepDone = targetStep + 1;
  runStepIndex = targetStep + 1;
  document.querySelectorAll('.step').forEach((el, i) => {
    if (i <= targetStep) el.className = 'step done';
    else el.className = 'step pending';
  });
  const clickedEl = document.getElementById('step-' + targetStep);
  if (clickedEl) clickedEl.className = 'step active';
  initInspector();
  for (let i = 1; i <= targetStep + 1; i++) inspStep(i);
  dots = [];
  fading = {};
  paused = true;
  updatePlayBtn();
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  requestAnimationFrame(() => { draw(); draw(); });
}

function doReset() {
  Object.keys(N).forEach(k => { if (N[k]._origColor) { N[k].color = N[k]._origColor; delete N[k]._origColor; } });
  running = false;
  paused = false;
  runStepIndex = 0;
  if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
  dots = [];
  activeNodes.clear();
  badges = {};
  lines = [];
  glowing.clear();
  fading = {};
  currentStepDone = 0;
  snapshots = [];
  inspHeaders = [];
  inspBody = [];
  inspCycle = [];
  initSteps();
  updatePlayBtn();
  document.getElementById('insp-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:13px">Press Start to see the request flow</div>';
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  draw();
}

document.getElementById('flow-select').addEventListener('change', function() {
  activeFlow = this.value;
  flow = flowMap[activeFlow];
  updateTitle();
  doReset();
});

resize();
initSteps();
updateTitle();
draw();

// Auto-start loop mode on page load
setTimeout(() => { toggleLoop(); }, 500);
</script>
</body>
