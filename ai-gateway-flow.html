<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Inference Gateway -- Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

/* Right Panel */
.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#58a6ff}
.flow-bar .start{border-color:#3fb950;color:#3fb950}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:0 1 auto;overflow-y:auto;max-height:52%}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#1a233244}
body.light .step:hover{background:#ddf4ff44}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending{color:#484f58}
body.light .step.pending{color:#b0b8c1}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#58a6ff}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}
.step .step-mk::before{content:'\25CB'}

.insp-section{flex:1;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif;flex-shrink:0;padding:0 0 6px;border-bottom:1px solid #30363d}
body.light .insp-title{border-color:#d0d7de}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6;transition:all .4s}
.insp-line.add{background:#1a2e1a;color:#3fb950;border-left:3px solid #3fb950}
body.light .insp-line.add{background:#dafbe1;color:#116329}
.insp-line.del{background:#2d1517;color:#f85149;text-decoration:line-through;opacity:.7;border-left:3px solid #f85149}
body.light .insp-line.del{background:#ffebe9;color:#82071e}
.insp-line.keep{color:#8b949e;border-left:3px solid transparent}
.insp-line.highlight{background:#1a2332;color:#58a6ff;border-left:3px solid #58a6ff;animation:pulse .8s}
body.light .insp-line.highlight{background:#ddf4ff;color:#0969da}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:1}}
.insp-plugin{margin:8px 0 4px;padding:4px 8px;background:#d2a8ff22;border-radius:4px;color:#d2a8ff;font-weight:600;font-size:12px;font-family:-apple-system,sans-serif}
body.light .insp-plugin{background:#8250df15;color:#8250df}

/* Theme toggle — top-left corner */
.theme-toggle{position:fixed;top:16px;left:16px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

/* Legend */
.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;transition:all .3s}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

/* Scrollbar */
.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-track,.insp-section::-webkit-scrollbar-track{background:transparent}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-section::-webkit-scrollbar-thumb,body.light .insp-section::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>

<button class="theme-toggle" id="thm" onclick="toggleTheme()">&#9790;</button>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flow-select">
      <option value="ext">External Model (Anthropic)</option>
      <option value="inc" disabled>On-Cluster (vLLM) -- coming soon</option>
      <option value="af" disabled>Auth Failure (401) -- coming soon</option>
    </select>
    <button class="start" onclick="run()">&#9654; Start</button>
    <button class="rst" onclick="doReset()">Reset</button>
  </div>
  <div class="steps-section" id="steps-section">
    <div class="steps-title">Flow Steps</div>
    <div id="steps-ctr"></div>
  </div>
  <div class="insp-section" id="insp-section">
    <div class="insp-title">Request Inspector</div>
    <div id="insp-content"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Auth / Rate Limit</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Payload Processor</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, isDark = true, animFrame = null, dots = [], activeNodes = new Set(), currentStepDone = 0;
let badges = {}, lines = [], running = false, glowing = new Set(), fading = {};
let inspHeaders = [], inspBody = [], inspCycle = [], inspStepLabel = '';
let snapshots = []; // State snapshot after each step completes

// Logical canvas dimensions
const LW = 1200, LH = 900;
let ox = 0, oy = 0, sc = 1;

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('thm').innerHTML = isDark ? '&#9790;' : '&#9788;';
  draw();
}

// ================================================================
// NODES
// ================================================================
const N = {
  user: { x: 530, y: 10, w: 80, h: 50, label: 'Client / Agent', type: 'icon' },

  cluster: { x: 120, y: 80, w: 1020, h: 810, type: 'boundary' },
  aigw: { x: 155, y: 115, w: 960, h: 560, type: 'container', label: 'AI Inference Gateway', color: '#58a6ff' },

  gw: { x: 250, y: 140, w: 650, h: 80, label: 'Istio Gateway', sublabel: '(Envoy)', color: '#58a6ff', fs: 18 },

  wasm: { x: 280, y: 260, w: 300, h: 280, type: 'container', label: 'Kuadrant Wasm Shim', color: '#f0883e' },
  auth: { x: 305, y: 315, w: 250, h: 60, label: 'Auth', sublabel: '(Authorino)', color: '#f0883e', fs: 15, inner: true },
  rlimit: { x: 305, y: 400, w: 250, h: 60, label: 'Rate Limit', sublabel: '(Limitador)', color: '#f0883e', fs: 15, inner: true },

  ipp: { x: 640, y: 260, w: 400, h: 370, type: 'container', label: 'Payload Processor (ext_proc)', color: '#d2a8ff' },
  p_bfth: { x: 670, y: 310, w: 345, h: 42, label: 'body-field-to-header', color: '#d2a8ff', type: 'plugin', inner: true, fs: 14 },
  p_mpr:  { x: 670, y: 360, w: 345, h: 42, label: 'model-provider-resolver', color: '#d2a8ff', type: 'plugin', inner: true, fs: 14 },
  p_at:   { x: 670, y: 410, w: 345, h: 42, label: 'api-translation', sublabel: '(req + resp)', color: '#d2a8ff', type: 'plugin', inner: true, fs: 14 },
  p_aki:  { x: 670, y: 460, w: 345, h: 42, label: 'apikey-injection', color: '#d2a8ff', type: 'plugin', inner: true, fs: 14 },
  p_guard:{ x: 670, y: 510, w: 345, h: 42, label: 'guardrail (nemo)', sublabel: '(req + resp)', color: '#d2a8ff', type: 'plugin', inner: true, fs: 14 },

  // External models — far left, outside cluster
  openai:    { x: 5, y: 250, w: 105, h: 50, label: 'OpenAI',       sublabel: 'gpt-4o-mini',      color: '#3fb950', fs: 12 },
  anthropic: { x: 5, y: 310, w: 105, h: 50, label: 'Anthropic',    sublabel: 'claude-haiku-4-5',  color: '#3fb950', fs: 12 },
  azure:     { x: 5, y: 370, w: 105, h: 50, label: 'Azure OpenAI', sublabel: 'gpt-4.1-mini',     color: '#3fb950', fs: 11 },
  bedrock:   { x: 5, y: 430, w: 105, h: 50, label: 'Bedrock',      sublabel: 'claude-3-haiku',   color: '#3fb950', fs: 12 },
  vertex:    { x: 5, y: 490, w: 105, h: 50, label: 'Vertex AI',    sublabel: 'gemini-2.5-flash', color: '#3fb950', fs: 12 },

  // MaaS API — left side, inside cluster but outside AI Gateway, below Kuadrant
  maas: { x: 170, y: 680, w: 170, h: 55, label: 'MaaS API', sublabel: 'key validation', color: '#79c0ff', fs: 14 },

  // llm-d Scheduler — bottom center
  sched: { x: 450, y: 720, w: 200, h: 55, label: 'llm-d Scheduler', sublabel: '(EPP)', color: '#79c0ff', fs: 14 },

  pool: { x: 380, y: 790, w: 380, h: 80, type: 'boundary', label: 'InferencePool' },
  vllm:   { x: 400, y: 812, w: 100, h: 42, label: 'vLLM',   color: '#8b949e', fs: 14 },
  triton: { x: 520, y: 812, w: 100, h: 42, label: 'Triton', color: '#8b949e', fs: 14 },
  sglang: { x: 640, y: 812, w: 100, h: 42, label: 'SGLang', color: '#8b949e', fs: 14 },
};

const tips = {
  p_bfth:  'Extracts model name from body to X-Gateway-Model-Name header',
  p_mpr:   'Looks up ExternalModel CRD via reconciler, resolves provider + endpoint',
  p_at:    'Translates request/response between OpenAI and provider formats',
  p_aki:   'Injects provider API key from Kubernetes Secret',
  p_guard: 'NeMo safety guardrail filter on request and response',
  auth:    'Validates API key via gRPC dispatch to Authorino',
  rlimit:  'Checks token quota via gRPC call to Limitador',
};

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', boxA:'#1a2332', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e', brt:'#fff' }
    : { bg:'#fff', box:'#f6f8fa', boxA:'#ddf4ff', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76', brt:'#000' };
}

// ================================================================
// DRAWING
// ================================================================
function resize() {
  const panelW = 380;
  W = canvas.width = innerWidth - panelW;
  H = canvas.height = innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.92;
  ox = (W - LW * sc) / 2;
  oy = (H - LH * sc) / 2;
  draw();
}
addEventListener('resize', resize);

function tx(x) { return ox + x * sc; }
function ty(y) { return oy + y * sc; }
function ts(s) { return s * sc; }

function drawBox(key) {
  const n = N[key], c = C();
  if (!n || n.type === 'boundary' || n.type === 'container') return;
  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h);
  const isA = activeNodes.has(key), hasBadge = badges[key] != null;
  ctx.save();

  if (n.type === 'icon') {
    ctx.font = `${ts(32)}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F464}', x + w / 2, y + ts(26));
    ctx.font = `bold ${ts(16)}px system-ui`;
    ctx.fillStyle = c.txt;
    ctx.fillText(n.label, x + w / 2, y + ts(46));
    ctx.restore();
    return;
  }

  let fadeA = 1;
  if (fading[key]) {
    const el = Date.now() - fading[key];
    fadeA = Math.min(el / 500, 1);
    if (el > 500) delete fading[key];
  }

  if (isA || hasBadge) {
    ctx.shadowColor = n.color;
    ctx.shadowBlur = ts(18) * fadeA;
    ctx.globalAlpha = 0.3 + 0.7 * fadeA;
  }

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, ts(8));
  ctx.fillStyle = (isA || hasBadge) ? c.boxA : c.box;
  ctx.fill();
  ctx.strokeStyle = (isA || hasBadge) ? n.color : c.bdr;
  ctx.lineWidth = ts((isA || hasBadge) ? 2.5 : 1.5);
  if (n.type === 'plugin') { ctx.setLineDash([ts(5), ts(4)]); }
  ctx.stroke();
  ctx.setLineDash([]);

  const fs = n.fs || 14;
  ctx.fillStyle = c.txt;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (n.sublabel) {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2 - ts(8));
    ctx.font = `${ts(Math.max(fs - 3, 11))}px system-ui`;
    ctx.fillStyle = c.dim;
    ctx.fillText(n.sublabel, x + w / 2, y + h / 2 + ts(8));
  } else {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2);
  }

  // Badges
  if (hasBadge) {
    const bList = Array.isArray(badges[key]) ? badges[key] : [badges[key]];
    bList.forEach((bNum, idx) => {
      const bx = x + ts(8) + idx * ts(22), by = y + ts(5), br = ts(9);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(bx + br, by + br, br, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.fill();
      ctx.font = `bold ${ts(10)}px system-ui`;
      ctx.fillStyle = isDark ? '#0d1117' : '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(bNum), bx + br, by + br);
    });
  }
  ctx.restore();
}

function drawContainer(key, isGlow) {
  const n = N[key], c = C();
  if (!n || n.type !== 'container') return;
  ctx.save();
  if (isGlow) { ctx.shadowColor = n.color; ctx.shadowBlur = ts(22); }
  ctx.beginPath();
  ctx.roundRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h), ts(10));
  const a = isGlow ? 'cc' : '55';
  ctx.strokeStyle = n.color + a;
  ctx.lineWidth = ts(isGlow ? 3 : 2.5);
  ctx.setLineDash([ts(7), ts(5)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `bold ${ts(12)}px system-ui`;
  ctx.fillStyle = n.color + (isDark ? 'aa' : '99');
  ctx.textAlign = 'left';
  ctx.fillText(n.label, tx(n.x + 12), ty(n.y + 18));
  ctx.restore();
}

function drawBounds() {
  const c = C();
  // Cluster boundary
  const cb = N.cluster;
  ctx.beginPath();
  ctx.roundRect(tx(cb.x), ty(cb.y), ts(cb.w), ts(cb.h), ts(14));
  ctx.strokeStyle = c.bdr;
  ctx.lineWidth = ts(2.5);
  ctx.setLineDash([ts(10), ts(8)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `${ts(13)}px system-ui`;
  ctx.fillStyle = isDark ? 'rgba(63,185,80,0.6)' : 'rgba(26,127,55,0.6)';
  ctx.textAlign = 'right';
  ctx.fillText('kubernetes cluster', tx(cb.x + cb.w - 15), ty(cb.y + 18));

  // AI Gateway boundary
  drawContainer('aigw', false);
  // Wasm container
  drawContainer('wasm', glowing.has('wasm'));
  // IPP container
  drawContainer('ipp', glowing.has('ipp'));

  // InferencePool boundary
  const ip = N.pool;
  ctx.beginPath();
  ctx.roundRect(tx(ip.x), ty(ip.y), ts(ip.w), ts(ip.h), ts(10));
  ctx.strokeStyle = c.bdr;
  ctx.lineWidth = ts(2);
  ctx.setLineDash([ts(6), ts(5)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `${ts(13)}px system-ui`;
  ctx.fillStyle = c.dim;
  ctx.textAlign = 'left';
  ctx.fillText(ip.label, tx(ip.x + 12), ty(ip.y + 18));
}

function edgePt(n, targetX, targetY, yOff) {
  const cx_ = n.x + n.w / 2, cy_ = n.y + n.h / 2;
  const dx = targetX - cx_, dy = targetY - cy_;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return { x: cx_, y: cy_ };
  const hw = n.w / 2, hh = n.h / 2;
  let ex, ey;
  if (Math.abs(dx) * hh > Math.abs(dy) * hw) {
    ex = cx_ + (dx > 0 ? hw : -hw);
    ey = cy_ + dy * (hw / Math.abs(dx));
  } else {
    ey = cy_ + (dy > 0 ? hh : -hh);
    ex = cx_ + dx * (hh / Math.abs(dy));
  }
  return { x: ex, y: ey + (yOff || 0) };
}

function drawArrowLine(x1, y1, x2, y2, color, num, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.beginPath();
  ctx.moveTo(tx(x1), ty(y1));
  ctx.lineTo(tx(x2), ty(y2));
  ctx.strokeStyle = color;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1), sz = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2) - sz * Math.cos(ang - 0.4), ty(y2) - sz * Math.sin(ang - 0.4));
  ctx.lineTo(tx(x2) - sz * Math.cos(ang + 0.4), ty(y2) - sz * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (num != null) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, r = ts(12);
    ctx.beginPath();
    ctx.arc(tx(mx), ty(my), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), tx(mx), ty(my));
  }
  ctx.restore();
}

function drawLines() {
  lines.forEach(l => {
    const fn = N[l.from], tn = N[l.to];
    if (!fn || !tn) return;
    if (l.waypoints) {
      const fp = resolveEdge(fn, l, true);
      const tp = resolveEdge(tn, l, false);
      const pts = [fp, ...l.waypoints, tp];
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.moveTo(tx(pts[0].x), ty(pts[0].y));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(tx(pts[i].x), ty(pts[i].y));
      ctx.strokeStyle = l.color;
      ctx.lineWidth = ts(2.5);
      ctx.stroke();
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const ang = Math.atan2(last.y - prev.y, last.x - prev.x), sz = ts(10);
      ctx.beginPath();
      ctx.moveTo(tx(last.x), ty(last.y));
      ctx.lineTo(tx(last.x) - sz * Math.cos(ang - 0.4), ty(last.y) - sz * Math.sin(ang - 0.4));
      ctx.lineTo(tx(last.x) - sz * Math.cos(ang + 0.4), ty(last.y) - sz * Math.sin(ang + 0.4));
      ctx.closePath();
      ctx.fillStyle = l.color;
      ctx.fill();
      if (l.num != null) {
        const mid = pts[Math.floor(pts.length / 2)];
        const r = ts(12);
        ctx.beginPath();
        ctx.arc(tx(mid.x), ty(mid.y), r, 0, Math.PI * 2);
        ctx.fillStyle = l.color;
        ctx.fill();
        ctx.font = `bold ${ts(10)}px system-ui`;
        ctx.fillStyle = isDark ? '#0d1117' : '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(l.num), tx(mid.x), ty(mid.y));
      }
      ctx.restore();
    } else {
      const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
      const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
      const yo = l.yOff || 0;
      const fp = edgePt(fn, tc, tcy, yo);
      const tp = edgePt(tn, fc, fy, yo);
      drawArrowLine(fp.x, fp.y, tp.x, tp.y, l.color, l.num, 0.8);
    }
  });
}

function resolveEdge(n, l, isFrom) {
  const yo = l.yOff || 0;
  if (isFrom) {
    if (l.fromLeft) return { x: n.x, y: n.y + n.h / 2 + yo };
    if (l.fromRight) return { x: n.x + n.w, y: n.y + n.h / 2 + yo };
    if (l.fromBottom) return { x: n.x + n.w / 2 + (l.fromXOff || l.xOff || 0), y: n.y + n.h + yo };
    if (l.fromTop) return { x: n.x + n.w / 2 + (l.fromXOff || 0), y: n.y + yo };
    if (l.waypoints) return edgePt(n, l.waypoints[0].x, l.waypoints[0].y, yo);
    return { x: n.x + n.w / 2, y: n.y + n.h / 2 + yo };
  } else {
    if (l.toLeft) return { x: n.x, y: n.y + n.h / 2 + yo };
    if (l.toTop) return { x: n.x + n.w / 2 + (l.toXOff || l.xOff || 0), y: n.y + yo };
    if (l.toRight) return { x: n.x + n.w, y: n.y + n.h / 2 + yo };
    if (l.toBottom) return { x: n.x + n.w / 2 + (l.toXOff || 0), y: n.y + n.h + yo };
    if (l.waypoints) { const wp = l.waypoints; return edgePt(n, wp[wp.length - 1].x, wp[wp.length - 1].y, yo); }
    return { x: n.x + n.w / 2, y: n.y + n.h / 2 + yo };
  }
}

// Tooltip
let hoverKey = null;
canvas.addEventListener('mousemove', e => {
  const mx = (e.clientX - ox) / sc, my = (e.clientY - oy) / sc;
  hoverKey = null;
  for (const k of Object.keys(tips)) {
    const n = N[k];
    if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) { hoverKey = k; break; }
  }
  canvas.style.cursor = hoverKey ? 'help' : 'default';
});

function drawTooltip() {
  if (!hoverKey) return;
  const n = N[hoverKey], txt = tips[hoverKey];
  const x = tx(n.x + n.w / 2), y = ty(n.y) - ts(12);
  ctx.save();
  ctx.font = `${ts(12)}px system-ui`;
  const m = ctx.measureText(txt);
  const pw = m.width + ts(16), ph = ts(26);
  const bx = x - pw / 2, by = y - ph;
  ctx.fillStyle = isDark ? '#30363d' : '#d0d7de';
  ctx.beginPath();
  ctx.roundRect(bx, by, pw, ph, ts(6));
  ctx.fill();
  ctx.fillStyle = isDark ? '#c9d1d9' : '#24292f';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, x, by + ph / 2);
  ctx.restore();
}

// ================================================================
// ANIMATED DOT
// ================================================================
class Dot {
  constructor(fKey, tKey, color, speed, cb, opts) {
    this.color = color;
    this.speed = speed || 0.012;
    this.t = 0;
    this.cb = cb;
    this.alive = true;
    const fn = N[fKey], tn = N[tKey];
    const yo = (opts && opts.yOff) || 0;
    let fp, tp;

    if (opts && opts.waypoints) {
      fp = resolveEdge(fn, { ...opts, waypoints: opts.waypoints }, true);
      tp = resolveEdge(tn, { ...opts, waypoints: opts.waypoints }, false);
      this.pts = [fp, ...opts.waypoints, tp];
    } else {
      const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
      const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
      fp = edgePt(fn, tc, tcy, yo);
      tp = edgePt(tn, fc, fy, yo);
      this.pts = [fp, tp];
    }

    this.segLens = [];
    this.totalLen = 0;
    for (let i = 1; i < this.pts.length; i++) {
      const dx = this.pts[i].x - this.pts[i - 1].x, dy = this.pts[i].y - this.pts[i - 1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      this.segLens.push(len);
      this.totalLen += len;
    }
    this.segIdx = 0;
    this.x = this.pts[0].x;
    this.y = this.pts[0].y;
  }
  update() {
    this.t += this.speed;
    if (this.t >= 1) { this.t = 1; this.alive = false; if (this.cb) this.cb(); }
    const dist = this.t * this.totalLen;
    let accum = 0;
    for (let i = 0; i < this.segLens.length; i++) {
      if (accum + this.segLens[i] >= dist) {
        const segT = (dist - accum) / this.segLens[i];
        this.x = this.pts[i].x + (this.pts[i + 1].x - this.pts[i].x) * segT;
        this.y = this.pts[i].y + (this.pts[i + 1].y - this.pts[i].y) * segT;
        this.segIdx = i;
        return;
      }
      accum += this.segLens[i];
    }
    const last = this.pts[this.pts.length - 1];
    this.x = last.x;
    this.y = last.y;
    this.segIdx = this.segLens.length - 1;
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(tx(this.pts[0].x), ty(this.pts[0].y));
    for (let i = 0; i <= this.segIdx; i++) {
      ctx.lineTo(tx(this.pts[i + 1].x), ty(this.pts[i + 1].y));
    }
    ctx.lineTo(tx(this.x), ty(this.y));
    ctx.strokeStyle = this.color;
    ctx.lineWidth = ts(2.5);
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.arc(tx(this.x), ty(this.y), ts(6), 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = ts(14);
    ctx.fill();
    ctx.restore();
  }
}

// ================================================================
// MAIN DRAW LOOP
// ================================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBounds();
  drawLines();
  Object.keys(N).forEach(k => drawBox(k));
  dots.forEach(d => { d.update(); d.draw(); });
  dots = dots.filter(d => d.alive);
  drawTooltip();
}
function animate() { draw(); animFrame = requestAnimationFrame(animate); }

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function initSteps() {
  const ctr = document.getElementById('steps-ctr');
  ctr.innerHTML = '';
  flow.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'step pending';
    d.id = 'step-' + i;
    d.innerHTML = `<span class="step-mk"></span><span>${esc(s.t)}</span>`;
    d.onclick = () => jumpToStep(i);
    ctr.appendChild(d);
  });
}

// ================================================================
// INSPECTOR
// ================================================================
function initInspector() {
  inspHeaders = [
    { v: 'POST /llm/ext-anthropic/v1/chat/completions', s: 'keep', id: 'h-path' },
    { v: 'Authorization: Bearer sk-oai-abc123...', s: 'keep', id: 'h-auth' },
    { v: 'Content-Type: application/json', s: 'keep', id: 'h-ct' },
  ];
  inspBody = [
    { v: '"model": "claude-haiku-4-5-20251001"', s: 'keep', id: 'b-model' },
    { v: '"messages": [{"role":"user","content":"Hello"}]', s: 'keep', id: 'b-msgs' },
    { v: '"max_tokens": 100', s: 'keep', id: 'b-max' },
    { v: '"stream": false', s: 'keep', id: 'b-stream' },
  ];
  inspCycle = [];
  inspStepLabel = 'Initial Request';
  renderInsp();
}

function renderInsp() {
  const el = document.getElementById('insp-content');
  let h = `<div class="insp-plugin">${esc(inspStepLabel)}</div>`;
  h += '<div class="insp-sec">Headers:</div>';
  inspHeaders.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  if (inspCycle.length) {
    h += '<div class="insp-sec">CycleState:</div>';
    inspCycle.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  }
  h += '<div class="insp-sec">Body:</div>';
  inspBody.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  el.innerHTML = h;
}

function resetStyles() {
  inspHeaders.forEach(l => { if (l.s !== 'del') l.s = 'keep'; });
  inspBody.forEach(l => { if (l.s !== 'del') l.s = 'keep'; });
  inspCycle.forEach(l => { if (l.s !== 'del') l.s = 'keep'; });
}

function inspStep(stepNum) {
  resetStyles();
  switch (stepNum) {
    case 1:
      inspStepLabel = '① Incoming Request';
      break;
    case 2:
      inspStepLabel = '② Kuadrant Wasm Shim';
      inspHeaders.find(l => l.id === 'h-auth').s = 'highlight';
      break;
    case 3:
      inspStepLabel = '③ Authorino (Auth)';
      inspHeaders.find(l => l.id === 'h-auth').s = 'highlight';
      break;
    case 4:
      inspStepLabel = '④ Authorino → MaaS API';
      break;
    case 5:
      inspStepLabel = '⑤ MaaS API: key valid';
      break;
    case 6:
      inspStepLabel = '⑥ Limitador (Rate Limit)';
      break;
    case 7:
      inspStepLabel = '⑦ Payload Processor (ext_proc)';
      break;
    case 8:
      inspStepLabel = '⑧ body-field-to-header';
      inspHeaders.push({ v: 'X-Gateway-Model-Name: claude-haiku-4-5-20251001', s: 'add', id: 'h-xmodel' });
      break;
    case 9:
      inspStepLabel = '⑨ model-provider-resolver';
      inspCycle = [
        { v: 'provider = "anthropic"', s: 'add', id: 'c-prov' },
        { v: 'targetModel = "claude-haiku-4-5-20251001"', s: 'add', id: 'c-model' },
      ];
      break;
    case 10:
      inspStepLabel = '⑩ api-translation (request)';
      inspHeaders.find(l => l.id === 'h-path').s = 'del';
      inspHeaders.push({ v: 'POST /v1/messages', s: 'add', id: 'h-path2' });
      inspHeaders.push({ v: 'anthropic-version: 2023-06-01', s: 'add', id: 'h-aver' });
      inspHeaders.find(l => l.id === 'h-auth').s = 'del';
      break;
    case 11:
      inspStepLabel = '⑪ apikey-injection';
      inspHeaders.push({ v: 'x-api-key: sk-ant-api03-xxxxx...', s: 'add', id: 'h-xapi' });
      break;
    case 12:
      inspStepLabel = '⑫ guardrail (request check)';
      break;
    case 13:
      inspStepLabel = '⑬ Route to Anthropic';
      const ph2 = inspHeaders.find(l => l.id === 'h-path2');
      if (ph2) ph2.s = 'highlight';
      const xapi = inspHeaders.find(l => l.id === 'h-xapi');
      if (xapi) xapi.s = 'highlight';
      break;
    case 14:
      inspStepLabel = '⑭ Anthropic Response (raw)';
      inspHeaders = [
        { v: 'HTTP/1.1 200 OK', s: 'keep', id: 'r-status' },
        { v: 'Content-Type: application/json', s: 'keep', id: 'r-ct' },
      ];
      inspBody = [
        { v: '"type": "message"', s: 'keep', id: 'r-type' },
        { v: '"content": [{"type":"text","text":"Hello!"}]', s: 'keep', id: 'r-content' },
        { v: '"stop_reason": "end_turn"', s: 'keep', id: 'r-stop' },
        { v: '"usage": {"input_tokens":8,"output_tokens":2}', s: 'keep', id: 'r-usage' },
      ];
      inspCycle = [];
      break;
    case 15:
      inspStepLabel = '⑮ Gateway → IPP (response processing)';
      break;
    case 16:
      inspStepLabel = '⑯ guardrail (response check)';
      break;
    case 17:
      inspStepLabel = '⑰ api-translation (response)';
      inspBody.find(l => l.id === 'r-type').s = 'del';
      inspBody.push({ v: '"object": "chat.completion"', s: 'add', id: 'r-obj' });
      inspBody.find(l => l.id === 'r-content').s = 'del';
      inspBody.push({ v: '"choices": [{"message":{"content":"Hello!"}}]', s: 'add', id: 'r-choices' });
      inspBody.find(l => l.id === 'r-stop').s = 'del';
      inspBody.push({ v: '"finish_reason": "stop"', s: 'add', id: 'r-finish' });
      inspBody.find(l => l.id === 'r-usage').s = 'del';
      inspBody.push({ v: '"usage": {"prompt_tokens":8,"completion_tokens":2,"total_tokens":10}', s: 'add', id: 'r-usage2' });
      break;
    case 18:
      inspStepLabel = '⑱ Wasm reads usage.total_tokens';
      const u2 = inspBody.find(l => l.id === 'r-usage2');
      if (u2) u2.s = 'highlight';
      break;
    case 19:
      inspStepLabel = '⑲ Limitador: report token count';
      break;
    case 20:
      inspStepLabel = '⑳ Response to Client (OpenAI format)';
      const robj = inspBody.find(l => l.id === 'r-obj');
      if (robj) robj.s = 'highlight';
      const rch = inspBody.find(l => l.id === 'r-choices');
      if (rch) rch.s = 'highlight';
      break;
  }
  renderInsp();
}

// ================================================================
// FLOW DEFINITION — 20 steps
// ================================================================
const flow = [
  // REQUEST PATH
  // REQUEST PATH
  { t: '1. Client sends POST /v1/chat/completions', mode: 'arrow', f: 'user', to: 'gw', c: '#58a6ff', num: 1 },
  { t: '2. Gateway → Kuadrant Wasm Shim', mode: 'arrow', f: 'gw', to: 'wasm', c: '#f0883e', num: 2, glow: 'wasm', toLeft: true },
  { t: '3. Auth (Authorino) validates API key', mode: 'lightup', target: 'auth', badge: 3 },
  { t: '4. Kuadrant → MaaS API (key validation)', mode: 'arrow', f: 'wasm', to: 'maas', c: '#f0883e', num: 4, yOff: -8 },
  { t: '5. MaaS API responds: key valid', mode: 'arrow', f: 'maas', to: 'wasm', c: '#3fb950', num: 5, yOff: 8 },
  { t: '6. Rate Limit checks token quota', mode: 'lightup', target: 'rlimit', badge: 6 },
  { t: '7. Kuadrant → Gateway (auth complete)', mode: 'arrow', f: 'wasm', to: 'gw', c: '#f0883e', num: 7 },
  { t: '8. Gateway → ext_proc (IPP)', mode: 'arrow', f: 'gw', to: 'ipp', c: '#d2a8ff', num: 8, glow: 'ipp', toLeft: true },
  // IPP plugins — request path
  { t: '9. body-field-to-header extracts model name', mode: 'lightup', target: 'p_bfth', badge: 9 },
  { t: '10. model-provider-resolver looks up ExternalModel', mode: 'lightup', target: 'p_mpr', badge: 10 },
  { t: '11. api-translation: OpenAI → Anthropic format', mode: 'lightup', target: 'p_at', badge: 11 },
  { t: '12. apikey-injection: inject provider credential', mode: 'lightup', target: 'p_aki', badge: 12 },
  { t: '13. guardrail: safety check on request', mode: 'lightup', target: 'p_guard', badge: 13 },
  { t: '14. IPP → Gateway (mutated request)', mode: 'arrow', f: 'ipp', to: 'gw', c: '#d2a8ff', num: 14, yOff: 10 },
  { t: '15. Gateway routes to Anthropic', mode: 'arrow', f: 'gw', to: 'anthropic', c: '#58a6ff', num: 15 },
  // RESPONSE PATH
  { t: '16. Anthropic responds', mode: 'arrow', f: 'anthropic', to: 'gw', c: '#3fb950', num: 16, yOff: 10 },
  { t: '17. Gateway → IPP (response processing)', mode: 'arrow', f: 'gw', to: 'ipp', c: '#d2a8ff', num: 17, toLeft: true, yOff: 15 },
  { t: '18. guardrail: safety check on response', mode: 'lightup', target: 'p_guard', badge: 18 },
  { t: '19. api-translation: Anthropic → OpenAI response', mode: 'lightup', target: 'p_at', badge: 19 },
  { t: '20. IPP → Gateway (translated response)', mode: 'arrow', f: 'ipp', to: 'gw', c: '#3fb950', num: 20, yOff: 20 },
  // TOKEN USAGE REPORTING
  { t: '21. Wasm reads usage.total_tokens from response', mode: 'lightup', target: 'rlimit', badge: 21 },
  { t: '22. Wasm reports token count to Limitador', mode: 'lightup', target: 'rlimit', badge: 22 },
  { t: '23. Response to client (OpenAI format)', mode: 'arrow', f: 'gw', to: 'user', c: '#3fb950', num: 23 },
];

// ================================================================
// RUN / RESET
// ================================================================
function run() {
  if (running) return;
  doReset();
  running = true;
  let si = 0;
  currentStepDone = 0;
  initInspector();

  function next() {
    if (si >= flow.length) { running = false; return; }
    const s = flow[si];
    const el = document.getElementById('step-' + si);
    el.className = 'step active';
    // Scroll step into view
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    inspStep(si + 1);

    if (s.mode === 'arrow') {
      if (s.f) activeNodes.add(s.f);
      const opts = {
        toLeft: s.toLeft, fromRight: s.fromRight, toRight: s.toRight,
        fromBottom: s.fromBottom, fromTop: s.fromTop, toTop: s.toTop, toBottom: s.toBottom,
        yOff: s.yOff, xOff: s.xOff, waypoints: s.waypoints
      };
      dots.push(new Dot(s.f, s.to, s.c, 0.012, () => {
        lines.push({
          from: s.f, to: s.to, color: s.c, num: s.num,
          toLeft: s.toLeft, fromRight: s.fromRight, toRight: s.toRight,
          fromBottom: s.fromBottom, fromTop: s.fromTop, toTop: s.toTop, toBottom: s.toBottom,
          yOff: s.yOff, xOff: s.xOff, waypoints: s.waypoints
        });
        if (s.glow) glowing.add(s.glow);
        activeNodes.add(s.to);
        el.className = 'step done';
        currentStepDone = si + 1;
        saveSnapshot(si);
        si++;
        setTimeout(next, 500);
      }, opts));
    } else if (s.mode === 'lightup') {
      fading[s.target] = Date.now();
      activeNodes.add(s.target);
      if (badges[s.target] != null) {
        const existing = Array.isArray(badges[s.target]) ? badges[s.target] : [badges[s.target]];
        existing.push(s.badge);
        badges[s.target] = existing;
      } else {
        badges[s.target] = s.badge;
      }
      el.className = 'step done';
      currentStepDone = si + 1;
      saveSnapshot(si);
      si++;
      setTimeout(next, 500);
    }
  }

  setTimeout(next, 300);
  if (!animFrame) animate();
}

function saveSnapshot(stepIdx) {
  snapshots[stepIdx] = {
    activeNodes: new Set(activeNodes),
    badges: JSON.parse(JSON.stringify(badges)),
    lines: JSON.parse(JSON.stringify(lines)),
    glowing: new Set(glowing),
  };
}

function restoreSnapshot(stepIdx) {
  if (stepIdx < 0) {
    activeNodes.clear(); badges = {}; lines = []; glowing.clear();
    return;
  }
  const snap = snapshots[stepIdx];
  if (!snap) return;
  activeNodes = new Set(snap.activeNodes);
  badges = JSON.parse(JSON.stringify(snap.badges));
  lines = JSON.parse(JSON.stringify(snap.lines));
  glowing = new Set(snap.glowing);
}

function jumpToStep(targetStep) {
  if (running) return;
  // For forward jumps beyond what's been played, replay from current to target
  if (targetStep >= currentStepDone) {
    // Need to build snapshots up to targetStep by simulating
    // For now, only allow jumping to completed steps
    // (forward jump will be supported after full playback)
    if (!snapshots[targetStep]) return;
  }
  // Restore diagram state to after targetStep completed
  restoreSnapshot(targetStep);
  currentStepDone = targetStep + 1;
  // Update step markers
  document.querySelectorAll('.step').forEach((el, i) => {
    if (i <= targetStep) el.className = 'step done';
    else el.className = 'step pending';
  });
  // Highlight the clicked step
  const clickedEl = document.getElementById('step-' + targetStep);
  if (clickedEl) clickedEl.className = 'step active';
  // Update inspector to that step
  initInspector();
  for (let i = 1; i <= targetStep + 1; i++) inspStep(i);
  dots = [];
  fading = {};
  // Force a clean redraw on next frame
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  requestAnimationFrame(() => { draw(); draw(); }); // double draw to ensure clean state
}

function doReset() {
  running = false;
  dots = [];
  activeNodes.clear();
  badges = {};
  lines = [];
  glowing.clear();
  fading = {};
  currentStepDone = 0;
  snapshots = [];
  inspHeaders = [];
  inspBody = [];
  inspCycle = [];
  initSteps();
  document.getElementById('insp-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:13px">Press Start to see the request flow</div>';
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  draw();
}

resize();
initSteps();
draw();
