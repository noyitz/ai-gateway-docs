<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Inference Gateway -- Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}
canvas{display:block}

.panel{position:fixed;z-index:100;border-radius:10px;font-size:13px;transition:all .3s}
.pbg{background:#161b22;border:1px solid #30363d}
body.light .pbg{background:#f6f8fa;border-color:#d0d7de}

/* Controls */
.ctrl{top:16px;left:16px;width:240px;display:flex;flex-direction:column;gap:6px;padding:14px 16px;overflow:hidden;transition:all .3s}
.ctrl.collapsed{height:42px;padding:10px 16px;overflow:hidden}
.ctrl.collapsed>*:not(.ctrl-hdr){display:none}
.ctrl-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.ctrl-title{font-size:16px;font-weight:800;background:linear-gradient(90deg,#58a6ff,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ctrl-chev{font-size:14px;color:#8b949e;transition:transform .3s}
.ctrl.collapsed .ctrl-chev{transform:rotate(-90deg)}
.ctrl button{padding:9px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;transition:all .15s}
body.light .ctrl button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.ctrl button:hover{border-color:#58a6ff;background:#1a2332}
body.light .ctrl button:hover{background:#ddf4ff}
.ctrl button.on{border-color:#3fb950;background:#1a2e1a;color:#3fb950}
.ctrl .sep{border:none;border-top:1px solid #30363d;margin:3px 0}
body.light .ctrl .sep{border-color:#d0d7de}
.ctrl button.demo-btn{border-color:#d2a8ff;color:#d2a8ff}
.ctrl button.reset-btn{border-color:#f0883e;color:#f0883e}

/* Theme toggle */
.theme-toggle{position:fixed;top:16px;right:16px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

/* Steps panel */
.steps-panel{top:60px;right:16px;width:350px;max-height:38%;overflow-y:auto;padding:14px 16px}
.steps-title{font-weight:700;margin-bottom:8px;font-size:14px}
.step{margin:3px 0;color:#8b949e;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.5;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#656d76}
.step:hover{background:#1a233244}
body.light .step:hover{background:#ddf4ff44}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.active{color:#58a6ff}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}
.step.fail{color:#f85149}
.step.fail .step-mk::before{content:'\2717'}
.step .step-mk::before{content:'\25CB'}

/* Inspector */
.inspector{bottom:16px;right:16px;width:380px;height:380px;overflow:hidden;padding:14px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;display:flex;flex-direction:column}
.insp-title{font-weight:700;font-size:13px;margin-bottom:8px;font-family:-apple-system,sans-serif;flex-shrink:0}
.insp-scroll{overflow-y:auto;flex:1}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:11px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6;transition:all .4s}
.insp-line.add{background:#1a2e1a;color:#3fb950;border-left:3px solid #3fb950}
body.light .insp-line.add{background:#dafbe1;color:#116329}
.insp-line.del{background:#2d1517;color:#f85149;text-decoration:line-through;opacity:.7;border-left:3px solid #f85149}
body.light .insp-line.del{background:#ffebe9;color:#82071e}
.insp-line.keep{color:#8b949e;border-left:3px solid transparent}
.insp-line.highlight{background:#1a2332;color:#58a6ff;border-left:3px solid #58a6ff;animation:pulse .8s}
body.light .insp-line.highlight{background:#ddf4ff;color:#0969da}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:1}}
.insp-plugin{margin:8px 0 4px;padding:4px 8px;background:#d2a8ff22;border-radius:4px;color:#d2a8ff;font-weight:600;font-size:11px;font-family:-apple-system,sans-serif}
body.light .insp-plugin{background:#8250df15;color:#8250df}

/* Title */
.main-title{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:150;font-size:24px;font-weight:800;background:linear-gradient(90deg,#58a6ff,#d2a8ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;white-space:nowrap}

/* Legend */
.legend{bottom:16px;left:16px;padding:10px 14px}
.legend-title{font-weight:600;margin-bottom:5px;font-size:13px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.legend-dot{width:11px;height:11px;border-radius:50%}

/* Scrollbar */
.steps-panel::-webkit-scrollbar,.insp-scroll::-webkit-scrollbar{width:6px}
.steps-panel::-webkit-scrollbar-track,.insp-scroll::-webkit-scrollbar-track{background:transparent}
.steps-panel::-webkit-scrollbar-thumb,.insp-scroll::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-panel::-webkit-scrollbar-thumb,body.light .insp-scroll::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>

<div class="panel pbg ctrl" id="ctrl-panel">
<div class="ctrl-hdr" onclick="toggleCtrl()">
  <div class="ctrl-title">Flows</div>
  <div class="ctrl-chev">&#9660;</div>
</div>
<button onclick="run()" id="b-ext">External Model (Anthropic)</button>
<hr class="sep">
<button class="demo-btn" onclick="demo()" id="b-demo">&#9654; Demo Mode</button>
<button class="reset-btn" onclick="doReset()">Reset</button>
</div>

<button class="theme-toggle" id="thm" onclick="toggleTheme()">&#9790;</button>

<div class="panel pbg legend">
<div class="legend-title">Legend</div>
<div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
<div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
<div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>Error</div>
<div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Auth / Rate Limit</div>
<div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Payload Processor</div>
</div>

<div class="panel pbg steps-panel" id="steps-panel">
<div class="steps-title">Flow Steps</div>
<div id="steps-ctr"><div style="color:#8b949e">Select a flow to begin</div></div>
</div>

<div class="panel pbg inspector" id="inspector">
<div class="insp-title">Request Inspector</div>
<div class="insp-scroll" id="insp-scroll">
<div id="insp-content"></div>
</div>
</div>

<div class="main-title">AI Inference Gateway &#8212; Flow Visualizer</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, isDark = true, animFrame = null, dots = [], activeNodes = new Set();
let badges = {}, failNode = null, lines = [], running = false;
let glowing = new Set(), collapseTimer = null, fading = {};

// Accumulated inspector state
let inspHeaders = [], inspBody = [], inspCycle = [], inspStepLabel = '';

const LW = 1600, LH = 950;
let ox = 0, oy = 0, sc = 1;

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('thm').innerHTML = isDark ? '&#9790;' : '&#9788;';
  draw();
}
function toggleCtrl() { document.getElementById('ctrl-panel').classList.toggle('collapsed'); }

function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  sc = Math.min(W / LW, H / LH, 0.95);
  ox = (W - LW * sc) / 2; oy = (H - LH * sc) / 2;
  draw();
}
addEventListener('resize', resize);

function tx(x) { return ox + x * sc; }
function ty(y) { return oy + y * sc; }
function ts(s) { return s * sc; }

// ================================================================
// NODES — exact pixel positions from spec
// ================================================================
const N = {
  user: { x: 90, y: 25, w: 60, h: 50, label: 'User', type: 'icon' },

  cluster: { x: 180, y: 100, w: 1250, h: 850, type: 'boundary' },

  aigw: { x: 270, y: 120, w: 880, h: 640, type: 'container', label: 'AI Inference Gateway', color: '#58a6ff' },

  gw: { x: 310, y: 230, w: 250, h: 80, label: 'Istio Gateway', sublabel: '(Envoy)', color: '#58a6ff', fs: 15 },

  wasm: { x: 640, y: 150, w: 380, h: 210, type: 'container', label: 'Kuadrant Wasm Shim (inside Envoy)', color: '#f0883e' },
  auth: { x: 670, y: 195, w: 320, h: 50, label: 'Auth', sublabel: '(Authorino)', color: '#f0883e', fs: 13, inner: true },
  rlimit: { x: 670, y: 270, w: 320, h: 50, label: 'Rate Limit', sublabel: '(Limitador)', color: '#f0883e', fs: 13, inner: true },

  maas: { x: 1190, y: 180, w: 170, h: 60, label: 'MaaS API', sublabel: 'API key validation', color: '#79c0ff', fs: 13 },

  ipp: { x: 640, y: 400, w: 380, h: 330, type: 'container', label: 'Payload Processor (ext_proc)', color: '#d2a8ff' },
  p_bfth: { x: 670, y: 440, w: 320, h: 34, label: 'body-field-to-header', color: '#d2a8ff', type: 'plugin', inner: true },
  p_mpr:  { x: 670, y: 480, w: 320, h: 34, label: 'model-provider-resolver', color: '#d2a8ff', type: 'plugin', inner: true },
  p_at:   { x: 670, y: 520, w: 320, h: 34, label: 'api-translation', color: '#d2a8ff', type: 'plugin', inner: true },
  p_aki:  { x: 670, y: 560, w: 320, h: 34, label: 'apikey-injection', color: '#d2a8ff', type: 'plugin', inner: true },
  p_reqg: { x: 670, y: 600, w: 320, h: 34, label: 'request-guard', color: '#d2a8ff', type: 'plugin', inner: true },
  p_rg:   { x: 670, y: 640, w: 320, h: 34, label: 'response-guard', color: '#d2a8ff', type: 'plugin', inner: true },

  // External models — LEFT side, OUTSIDE cluster
  openai:    { x: 30, y: 280, w: 130, h: 50, label: 'OpenAI',      sublabel: 'gpt-4o-mini',        color: '#3fb950', fs: 12 },
  anthropic: { x: 30, y: 340, w: 130, h: 50, label: 'Anthropic',   sublabel: 'claude-haiku-4-5',   color: '#3fb950', fs: 12 },
  azure:     { x: 30, y: 400, w: 130, h: 50, label: 'Azure OpenAI',sublabel: 'gpt-4.1-mini',       color: '#3fb950', fs: 12 },
  bedrock:   { x: 30, y: 460, w: 130, h: 50, label: 'Bedrock',     sublabel: 'claude-3-haiku',     color: '#3fb950', fs: 12 },
  vertex:    { x: 30, y: 520, w: 130, h: 50, label: 'Vertex AI',   sublabel: 'gemini-2.5-flash',   color: '#3fb950', fs: 12 },

  sched: { x: 400, y: 790, w: 180, h: 55, label: 'llm-d Scheduler', sublabel: '(EPP)', color: '#79c0ff', fs: 13 },

  pool: { x: 310, y: 860, w: 380, h: 80, type: 'boundary', label: 'InferencePool' },
  vllm:   { x: 325, y: 880, w: 100, h: 40, label: 'vLLM',   color: '#8b949e', fs: 13 },
  triton: { x: 440, y: 880, w: 100, h: 40, label: 'Triton', color: '#8b949e', fs: 13 },
  sglang: { x: 555, y: 880, w: 100, h: 40, label: 'SGLang', color: '#8b949e', fs: 13 },
};

// Tooltips for plugins
const tips = {
  p_bfth: 'Extracts model name from body to X-Gateway-Model-Name header',
  p_mpr: 'Looks up ExternalModel CRD via reconciler, resolves provider + endpoint',
  p_at: 'Translates request/response between OpenAI and provider formats',
  p_aki: 'Injects provider API key from Kubernetes Secret',
  p_reqg: 'NeMo safety guardrail filter on outgoing request',
  p_rg: 'NeMo safety guardrail filter on incoming response',
  auth: 'Validates API key via gRPC dispatch to Authorino',
  rlimit: 'Checks token quota via gRPC call to Limitador',
};

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', boxA:'#1a2332', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e', brt:'#fff' }
    : { bg:'#fff', box:'#f6f8fa', boxA:'#ddf4ff', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76', brt:'#000' };
}

// ================================================================
// DRAWING
// ================================================================
function drawBox(key) {
  const n = N[key], c = C();
  if (!n || n.type==='boundary' || n.type==='container' || n.type==='hidden') return;
  const isA = activeNodes.has(key), isF = failNode===key, hasBadge = badges[key]!=null;
  const x=tx(n.x), y=ty(n.y), w=ts(n.w), h=ts(n.h);
  ctx.save();

  if (n.type==='icon') {
    ctx.font = `${ts(30)}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F464}', x+w/2, y+ts(24));
    ctx.font = `bold ${ts(14)}px system-ui`;
    ctx.fillStyle = c.txt;
    ctx.fillText(n.label, x+w/2, y+ts(44));
    ctx.restore(); return;
  }

  let fadeA = 1;
  if (fading[key]) {
    const el = Date.now() - fading[key];
    fadeA = Math.min(el/500, 1);
    if (el>500) delete fading[key];
  }

  if (isA || hasBadge) {
    ctx.shadowColor = isF ? '#f85149' : n.color;
    ctx.shadowBlur = ts(18)*fadeA;
    ctx.globalAlpha = .3 + .7*fadeA;
  }

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, ts(8));
  ctx.fillStyle = isF ? '#2d1517' : ((isA||hasBadge) ? c.boxA : c.box);
  ctx.fill();
  ctx.strokeStyle = isF ? '#f85149' : ((isA||hasBadge) ? n.color : c.bdr);
  ctx.lineWidth = ts((isF||isA||hasBadge) ? 2.5 : 1.5);
  if (n.type==='plugin') { ctx.setLineDash([ts(5),ts(4)]); }
  ctx.stroke();
  ctx.setLineDash([]);

  const fs = n.fs||12;
  ctx.fillStyle = isF ? '#f85149' : c.txt;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (n.sublabel) {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x+w/2, y+h/2-ts(8));
    ctx.font = `${ts(fs-3)}px system-ui`;
    ctx.fillStyle = isF ? '#f8514999' : c.dim;
    ctx.fillText(n.sublabel, x+w/2, y+h/2+ts(7));
  } else {
    ctx.font = `bold ${ts(fs)}px system-ui`;
    ctx.fillText(n.label, x+w/2, y+h/2);
  }

  // Badges (can have multiple)
  if (hasBadge) {
    const bList = Array.isArray(badges[key]) ? badges[key] : [badges[key]];
    bList.forEach((bNum, idx) => {
      const bx = x + ts(8) + idx*ts(20), by = y + ts(6), br = ts(8);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(bx+br, by+br, br, 0, Math.PI*2);
      ctx.fillStyle = n.color;
      ctx.fill();
      ctx.font = `bold ${ts(9)}px system-ui`;
      ctx.fillStyle = isDark ? '#0d1117' : '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(bNum), bx+br, by+br);
    });
  }

  ctx.restore();
}

function drawContainer(key, isGlow) {
  const n = N[key], c = C();
  if (!n || n.type!=='container') return;
  ctx.save();
  if (isGlow) { ctx.shadowColor = n.color; ctx.shadowBlur = ts(20); }
  ctx.beginPath();
  ctx.roundRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h), ts(10));
  const a = isGlow ? 'cc' : '55';
  ctx.strokeStyle = n.color + a;
  ctx.lineWidth = ts(isGlow ? 3 : 2);
  ctx.setLineDash([ts(6), ts(5)]);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.font = `bold ${ts(11)}px system-ui`;
  ctx.fillStyle = n.color + (isDark?'aa':'99');
  ctx.textAlign = 'left';
  ctx.fillText(n.label, tx(n.x+12), ty(n.y+16));
  ctx.restore();
}

function drawBounds() {
  const c = C();
  // Cluster
  const cb = N.cluster;
  ctx.beginPath();
  ctx.roundRect(tx(cb.x), ty(cb.y), ts(cb.w), ts(cb.h), ts(14));
  ctx.strokeStyle = c.bdr; ctx.lineWidth = ts(2);
  ctx.setLineDash([ts(10),ts(8)]); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = `${ts(13)}px system-ui`;
  ctx.fillStyle = isDark ? 'rgba(63,185,80,0.6)' : 'rgba(26,127,55,0.6)';
  ctx.textAlign = 'right';
  ctx.fillText('kubernetes cluster', tx(cb.x+cb.w-15), ty(cb.y+cb.h-15));

  // AI Gateway
  drawContainer('aigw', false);
  // Wasm
  drawContainer('wasm', glowing.has('wasm'));
  // IPP
  drawContainer('ipp', glowing.has('ipp'));

  // InferencePool
  const ip = N.pool;
  ctx.beginPath();
  ctx.roundRect(tx(ip.x), ty(ip.y), ts(ip.w), ts(ip.h), ts(10));
  ctx.strokeStyle = c.bdr; ctx.lineWidth = ts(1.5);
  ctx.setLineDash([ts(6),ts(5)]); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = `${ts(12)}px system-ui`; ctx.fillStyle = c.dim; ctx.textAlign = 'left';
  ctx.fillText(ip.label, tx(ip.x+12), ty(ip.y+16));
}

function edgePt(n, targetX, targetY, yOff) {
  const cx_=n.x+n.w/2, cy_=n.y+n.h/2;
  const dx=targetX-cx_, dy=targetY-cy_;
  if (Math.abs(dx)<1 && Math.abs(dy)<1) return {x:cx_, y:cy_};
  const hw=n.w/2, hh=n.h/2;
  let ex,ey;
  if (Math.abs(dx)*hh > Math.abs(dy)*hw) {
    ex = cx_ + (dx>0?hw:-hw); ey = cy_ + dy*(hw/Math.abs(dx));
  } else {
    ey = cy_ + (dy>0?hh:-hh); ex = cx_ + dx*(hh/Math.abs(dy));
  }
  return {x:ex, y:ey+(yOff||0)};
}

function leftPt(n) { return {x:n.x, y:n.y+n.h/2}; }
function rightPt(n) { return {x:n.x+n.w, y:n.y+n.h/2}; }

function drawArrowLine(x1,y1,x2,y2,color,num,alpha) {
  ctx.save(); ctx.globalAlpha = alpha||1;
  ctx.beginPath(); ctx.moveTo(tx(x1),ty(y1)); ctx.lineTo(tx(x2),ty(y2));
  ctx.strokeStyle = color; ctx.lineWidth = ts(2.5); ctx.stroke();
  const ang = Math.atan2(y2-y1, x2-x1), sz=ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2)-sz*Math.cos(ang-.4), ty(y2)-sz*Math.sin(ang-.4));
  ctx.lineTo(tx(x2)-sz*Math.cos(ang+.4), ty(y2)-sz*Math.sin(ang+.4));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  if (num!=null) {
    const mx=(x1+x2)/2, my=(y1+y2)/2, r=ts(12);
    ctx.beginPath(); ctx.arc(tx(mx),ty(my),r,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark?'#0d1117':'#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(num), tx(mx), ty(my));
  }
  ctx.restore();
}

function drawLines() {
  lines.forEach(l => {
    let fp, tp;
    const fn=N[l.from], tn=N[l.to];
    if (!fn||!tn) return;
    if (l.toLeft) {
      fp = edgePt(fn, tn.x, tn.y+tn.h/2, l.yOff||0);
      tp = leftPt(tn); tp = {x:tp.x, y:tp.y+(l.yOff||0)};
    } else if (l.fromRight) {
      fp = rightPt(fn); fp = {x:fp.x, y:fp.y+(l.yOff||0)};
      tp = edgePt(tn, fn.x+fn.w, fn.y+fn.h/2, l.yOff||0);
    } else if (l.toRight) {
      fp = edgePt(fn, tn.x+tn.w, tn.y+tn.h/2, l.yOff||0);
      tp = rightPt(tn); tp = {x:tp.x, y:tp.y+(l.yOff||0)};
    } else {
      const fc=fn.x+fn.w/2, fy=fn.y+fn.h/2, tc=tn.x+tn.w/2, tcy=tn.y+tn.h/2;
      fp = edgePt(fn, tc, tcy, l.yOff||0);
      tp = edgePt(tn, fc, fy, l.yOff||0);
    }
    drawArrowLine(fp.x, fp.y, tp.x, tp.y, l.color, l.num, .8);
  });
}

// Tooltip
let hoverKey = null;
canvas.addEventListener('mousemove', e => {
  const mx = (e.clientX - ox) / sc, my = (e.clientY - oy) / sc;
  hoverKey = null;
  for (const k of Object.keys(tips)) {
    const n = N[k];
    if (mx>=n.x && mx<=n.x+n.w && my>=n.y && my<=n.y+n.h) { hoverKey = k; break; }
  }
  canvas.style.cursor = hoverKey ? 'help' : 'default';
});

function drawTooltip() {
  if (!hoverKey) return;
  const n = N[hoverKey], txt = tips[hoverKey];
  const x = tx(n.x+n.w/2), y = ty(n.y)-ts(12);
  ctx.save();
  ctx.font = `${ts(11)}px system-ui`;
  const m = ctx.measureText(txt);
  const pw = m.width+ts(16), ph = ts(24);
  const bx = x-pw/2, by = y-ph;
  ctx.fillStyle = isDark ? '#30363d' : '#d0d7de';
  ctx.beginPath(); ctx.roundRect(bx,by,pw,ph,ts(6)); ctx.fill();
  ctx.fillStyle = isDark ? '#c9d1d9' : '#24292f';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, x, by+ph/2);
  ctx.restore();
}

// ================================================================
// ANIMATED DOT
// ================================================================
class Dot {
  constructor(fKey, tKey, color, speed, cb, opts) {
    this.color = color; this.speed = speed||.012;
    this.t = 0; this.cb = cb; this.alive = true;
    const fn=N[fKey], tn=N[tKey];
    const yo = (opts&&opts.yOff)||0;
    if (opts&&opts.toLeft) {
      this.fp = edgePt(fn, tn.x, tn.y+tn.h/2, yo);
      this.tp = leftPt(tn); this.tp = {x:this.tp.x, y:this.tp.y+yo};
    } else if (opts&&opts.fromRight) {
      this.fp = rightPt(fn); this.fp = {x:this.fp.x, y:this.fp.y+yo};
      this.tp = edgePt(tn, fn.x+fn.w, fn.y+fn.h/2, yo);
    } else if (opts&&opts.toRight) {
      this.fp = edgePt(fn, tn.x+tn.w, tn.y+tn.h/2, yo);
      this.tp = rightPt(tn); this.tp = {x:this.tp.x, y:this.tp.y+yo};
    } else {
      const fc=fn.x+fn.w/2, fy=fn.y+fn.h/2, tc=tn.x+tn.w/2, tcy=tn.y+tn.h/2;
      this.fp = edgePt(fn, tc, tcy, yo);
      this.tp = edgePt(tn, fc, fy, yo);
    }
  }
  update() {
    this.t += this.speed;
    if (this.t>=1) { this.t=1; this.alive=false; if(this.cb)this.cb(); }
    this.x = this.fp.x + (this.tp.x-this.fp.x)*this.t;
    this.y = this.fp.y + (this.tp.y-this.fp.y)*this.t;
  }
  draw() {
    // Progressive line
    ctx.beginPath(); ctx.moveTo(tx(this.fp.x),ty(this.fp.y));
    ctx.lineTo(tx(this.x),ty(this.y));
    ctx.strokeStyle = this.color; ctx.lineWidth = ts(2.5); ctx.stroke();
    // Dot
    ctx.save(); ctx.beginPath();
    ctx.arc(tx(this.x),ty(this.y),ts(6),0,Math.PI*2);
    ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = ts(14);
    ctx.fill(); ctx.restore();
  }
}

// ================================================================
// MAIN LOOP
// ================================================================
function draw() {
  ctx.clearRect(0,0,W,H);
  drawBounds(); drawLines();
  Object.keys(N).forEach(k => drawBox(k));
  dots.forEach(d => { d.update(); d.draw(); });
  dots = dots.filter(d => d.alive);
  drawTooltip();
}
function animate() { draw(); animFrame = requestAnimationFrame(animate); }

// ================================================================
// INSPECTOR — accumulated state
// ================================================================
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function initInspector() {
  inspHeaders = [
    { v: 'POST /llm/ext-anthropic/v1/chat/completions', s: 'keep', id: 'h-path' },
    { v: 'Authorization: Bearer sk-oai-abc123...', s: 'keep', id: 'h-auth' },
    { v: 'Content-Type: application/json', s: 'keep', id: 'h-ct' },
  ];
  inspBody = [
    { v: '"model": "claude-haiku-4-5-20251001"', s: 'keep', id: 'b-model' },
    { v: '"messages": [{"role":"user","content":"Hello"}]', s: 'keep', id: 'b-msgs' },
    { v: '"max_tokens": 100', s: 'keep', id: 'b-max' },
    { v: '"stream": false', s: 'keep', id: 'b-stream' },
  ];
  inspCycle = [];
  inspStepLabel = 'Initial Request';
  renderInsp();
}

function renderInsp() {
  const el = document.getElementById('insp-content');
  let h = `<div class="insp-plugin">${esc(inspStepLabel)}</div>`;
  h += '<div class="insp-sec">Headers:</div>';
  inspHeaders.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  if (inspCycle.length) {
    h += '<div class="insp-sec">CycleState:</div>';
    inspCycle.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  }
  h += '<div class="insp-sec">Body:</div>';
  inspBody.forEach(l => { h += `<div class="insp-line ${l.s}">${esc(l.v)}</div>`; });
  el.innerHTML = h;
}

// Mutate accumulated state per step
function inspStep(stepNum) {
  // Reset all to keep first
  inspHeaders.forEach(l => { if (l.s!=='del') l.s='keep'; });
  inspBody.forEach(l => { if (l.s!=='del') l.s='keep'; });
  inspCycle.forEach(l => { if (l.s!=='del') l.s='keep'; });

  switch(stepNum) {
    case 1: // User -> Gateway
      inspStepLabel = '① Incoming Request';
      break;

    case 2: // Gateway -> Wasm
      inspStepLabel = '② Kuadrant Wasm Shim';
      inspHeaders.find(l=>l.id==='h-auth').s = 'highlight';
      break;

    case 3: // Auth
      inspStepLabel = '③ Authorino (Auth)';
      inspHeaders.find(l=>l.id==='h-auth').s = 'highlight';
      break;

    case 4: // Wasm -> MaaS
      inspStepLabel = '④ Authorino → MaaS API';
      break;

    case 5: // MaaS -> Wasm
      inspStepLabel = '⑤ MaaS API: key valid';
      break;

    case 6: // Rate Limit
      inspStepLabel = '⑥ Limitador (Rate Limit)';
      break;

    case 7: // Gateway -> IPP
      inspStepLabel = '⑦ Payload Processor (ext_proc)';
      break;

    case 8: // body-field-to-header
      inspStepLabel = '⑧ body-field-to-header';
      inspHeaders.push({ v: 'X-Gateway-Model-Name: claude-haiku-4-5-20251001', s: 'add', id: 'h-xmodel' });
      break;

    case 9: // model-provider-resolver
      inspStepLabel = '⑨ model-provider-resolver';
      inspCycle = [
        { v: 'provider = "anthropic"', s: 'add', id: 'c-prov' },
        { v: 'targetModel = "claude-haiku-4-5-20251001"', s: 'add', id: 'c-model' },
      ];
      break;

    case 10: // api-translation (request)
      inspStepLabel = '⑩ api-translation (request)';
      inspHeaders.find(l=>l.id==='h-path').s = 'del';
      inspHeaders.push({ v: 'POST /v1/messages', s: 'add', id: 'h-path2' });
      inspHeaders.push({ v: 'anthropic-version: 2023-06-01', s: 'add', id: 'h-aver' });
      inspHeaders.find(l=>l.id==='h-auth').s = 'del';
      break;

    case 11: // apikey-injection
      inspStepLabel = '⑪ apikey-injection';
      inspHeaders.push({ v: 'x-api-key: sk-ant-api03-xxxxx...', s: 'add', id: 'h-xapi' });
      break;

    case 12: // request-guard
      inspStepLabel = '⑫ request-guard (nemo)';
      break;

    case 13: // Gateway -> Anthropic
      inspStepLabel = '⑬ Route to Anthropic';
      // Highlight final request headers
      const ph2 = inspHeaders.find(l=>l.id==='h-path2');
      if (ph2) ph2.s = 'highlight';
      const xapi = inspHeaders.find(l=>l.id==='h-xapi');
      if (xapi) xapi.s = 'highlight';
      const aver = inspHeaders.find(l=>l.id==='h-aver');
      if (aver) aver.s = 'highlight';
      break;

    case 14: // Anthropic -> Gateway (response)
      inspStepLabel = '⑭ Anthropic Response (raw)';
      // Switch to response view
      inspHeaders = [
        { v: 'HTTP/1.1 200 OK', s: 'keep', id: 'r-status' },
        { v: 'Content-Type: application/json', s: 'keep', id: 'r-ct' },
      ];
      inspBody = [
        { v: '"type": "message"', s: 'keep', id: 'r-type' },
        { v: '"content": [{"type":"text","text":"Hello!"}]', s: 'keep', id: 'r-content' },
        { v: '"stop_reason": "end_turn"', s: 'keep', id: 'r-stop' },
        { v: '"usage": {"input_tokens":8,"output_tokens":2}', s: 'keep', id: 'r-usage' },
      ];
      inspCycle = [];
      break;

    case 15: // api-translation (response)
      inspStepLabel = '⑮ api-translation (response)';
      inspBody.find(l=>l.id==='r-type').s = 'del';
      inspBody.push({ v: '"object": "chat.completion"', s: 'add', id: 'r-obj' });
      inspBody.find(l=>l.id==='r-content').s = 'del';
      inspBody.push({ v: '"choices": [{"message":{"content":"Hello!"}}]', s: 'add', id: 'r-choices' });
      inspBody.find(l=>l.id==='r-stop').s = 'del';
      inspBody.push({ v: '"finish_reason": "stop"', s: 'add', id: 'r-finish' });
      inspBody.find(l=>l.id==='r-usage').s = 'del';
      inspBody.push({ v: '"usage": {"prompt_tokens":8,"completion_tokens":2,"total_tokens":10}', s: 'add', id: 'r-usage2' });
      break;

    case 16: // response-guard
      inspStepLabel = '⑯ response-guard (nemo)';
      break;

    case 17: // Gateway -> User
      inspStepLabel = '⑰ Response to Client (OpenAI format)';
      const robj = inspBody.find(l=>l.id==='r-obj');
      if (robj) robj.s = 'highlight';
      const rch = inspBody.find(l=>l.id==='r-choices');
      if (rch) rch.s = 'highlight';
      break;
  }
  renderInsp();
}

// ================================================================
// FLOW
// ================================================================
const flow = [
  // 1: User -> Gateway
  { t: 'Client sends POST /v1/chat/completions', mode: 'arrow', f: 'user', to: 'gw', c: '#58a6ff', num: 1 },
  // 2: Gateway -> Wasm left edge
  { t: 'Gateway invokes Wasm filter', mode: 'arrow', f: 'gw', to: 'wasm', c: '#f0883e', num: 2, toLeft: true, glow: 'wasm' },
  // 3: Auth lights up
  { t: 'Auth validates API key (Authorino)', mode: 'lightup', target: 'auth', badge: 3 },
  // 4: Wasm -> MaaS API (request, yOff -8)
  { t: 'Wasm calls MaaS API for key validation', mode: 'arrow', f: 'wasm', to: 'maas', c: '#f0883e', num: 4, fromRight: true, yOff: -8 },
  // 5: MaaS API -> Wasm (response, yOff +8)
  { t: 'MaaS API responds: key valid', mode: 'arrow', f: 'maas', to: 'wasm', c: '#3fb950', num: 5, toRight: true, yOff: 8 },
  // 6: Rate Limit lights up
  { t: 'Rate Limit checks token quota', mode: 'lightup', target: 'rlimit', badge: 6 },
  // 7: Gateway -> IPP left edge
  { t: 'Gateway invokes ext_proc', mode: 'arrow', f: 'gw', to: 'ipp', c: '#d2a8ff', num: 7, toLeft: true, glow: 'ipp' },
  // 8: body-field-to-header
  { t: 'body-field-to-header: extract model → header', mode: 'lightup', target: 'p_bfth', badge: 8 },
  // 9: model-provider-resolver
  { t: 'model-provider-resolver: lookup ExternalModel', mode: 'lightup', target: 'p_mpr', badge: 9 },
  // 10: api-translation (request)
  { t: 'api-translation: OpenAI → Anthropic format', mode: 'lightup', target: 'p_at', badge: 10 },
  // 11: apikey-injection
  { t: 'apikey-injection: inject provider credential', mode: 'lightup', target: 'p_aki', badge: 11 },
  // 12: request-guard
  { t: 'request-guard: safety filter on request', mode: 'lightup', target: 'p_reqg', badge: 12 },
  // 13: Gateway -> Anthropic
  { t: 'Route to Anthropic', mode: 'arrow', f: 'gw', to: 'anthropic', c: '#58a6ff', num: 13 },
  // 14: Anthropic -> Gateway
  { t: 'Anthropic responds', mode: 'arrow', f: 'anthropic', to: 'gw', c: '#3fb950', num: 14 },
  // 15: api-translation (response)
  { t: 'api-translation: Anthropic → OpenAI response', mode: 'lightup', target: 'p_at', badge: 15 },
  // 16: response-guard
  { t: 'response-guard: safety filter on response', mode: 'lightup', target: 'p_rg', badge: 16 },
  // 17: Gateway -> User
  { t: 'Response to client (OpenAI format)', mode: 'arrow', f: 'gw', to: 'user', c: '#3fb950', num: 17 },
];

function run() {
  if (running) return;
  doReset();
  running = true;

  if (collapseTimer) clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => {
    document.getElementById('ctrl-panel').classList.add('collapsed');
  }, 60000);

  document.getElementById('b-ext').classList.add('on');

  let si = 0, currentStepDone = 0;

  const stCtr = document.getElementById('steps-ctr');
  stCtr.innerHTML = '';
  flow.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'step'; div.id = 'st-'+i;
    div.innerHTML = `<span class="step-mk"></span><span>${esc(s.t)}</span>`;
    div.addEventListener('click', () => {
      if (i+1 <= currentStepDone) {
        initInspector();
        for (let j=1; j<=i+1; j++) inspStep(j);
      }
    });
    stCtr.appendChild(div);
  });

  initInspector();

  function next() {
    if (si >= flow.length) { running = false; return; }
    const s = flow[si];
    const el = document.getElementById('st-'+si);
    el.className = 'step active';

    inspStep(si+1);

    if (s.mode === 'arrow') {
      if (s.f) activeNodes.add(s.f);
      const opts = { toLeft: s.toLeft, fromRight: s.fromRight, toRight: s.toRight, yOff: s.yOff };
      dots.push(new Dot(s.f, s.to, s.c, .012, () => {
        lines.push({ from:s.f, to:s.to, color:s.c, num:s.num, toLeft:s.toLeft, fromRight:s.fromRight, toRight:s.toRight, yOff:s.yOff });
        if (s.glow) glowing.add(s.glow);
        activeNodes.add(s.to);
        el.className = 'step done';
        currentStepDone = si+1;
        si++;
        setTimeout(next, 500);
      }, opts));
    } else if (s.mode === 'lightup') {
      fading[s.target] = Date.now();
      activeNodes.add(s.target);
      // Support multiple badges on same node (e.g., api-translation gets 10 and 15)
      if (badges[s.target] != null) {
        const existing = Array.isArray(badges[s.target]) ? badges[s.target] : [badges[s.target]];
        existing.push(s.badge);
        badges[s.target] = existing;
      } else {
        badges[s.target] = s.badge;
      }
      el.className = 'step done';
      currentStepDone = si+1;
      si++;
      setTimeout(next, 700);
    }
  }

  setTimeout(next, 300);
  if (!animFrame) animate();
}

function doReset() {
  running = false;
  dots = []; activeNodes.clear(); badges = {}; failNode = null;
  lines = []; glowing.clear(); fading = {};
  inspHeaders = []; inspBody = []; inspCycle = [];
  if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
  document.getElementById('ctrl-panel').classList.remove('collapsed');
  document.getElementById('b-ext').classList.remove('on');
  document.getElementById('steps-ctr').innerHTML = '<div style="color:#8b949e">Select a flow to begin</div>';
  document.getElementById('insp-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:12px">Run "External Model" flow to see request mutations</div>';
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  draw();
}

async function demo() {
  if (running) return;
  run();
  await new Promise(r => {
    const ck = () => running ? setTimeout(ck,200) : r();
    setTimeout(ck, 500);
  });
}

resize();
draw();
</script>
