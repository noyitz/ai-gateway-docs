<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Inference Gateway -- Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}
canvas{display:block}

/* Panels */
.panel{position:fixed;z-index:100;border-radius:10px;font-size:13px;transition:all .3s}
.panel-bg{background:#161b22;border:1px solid #30363d}
body.light .panel-bg{background:#f6f8fa;border:1px solid #d0d7de}

/* Controls */
.ctrl{top:16px;left:16px;width:260px;display:flex;flex-direction:column;gap:6px;padding:14px 16px;overflow:hidden;transition:all .3s}
.ctrl.collapsed{height:42px;padding:10px 16px;overflow:hidden}
.ctrl.collapsed>*:not(.ctrl-header){display:none}
.ctrl-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.ctrl-title{font-size:16px;font-weight:800;background:linear-gradient(90deg,#58a6ff,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ctrl-chevron{font-size:14px;color:#8b949e;transition:transform .3s}
.ctrl.collapsed .ctrl-chevron{transform:rotate(-90deg)}
.ctrl button{padding:9px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;transition:all .15s}
body.light .ctrl button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.ctrl button:hover{border-color:#58a6ff;background:#1a2332}
body.light .ctrl button:hover{background:#ddf4ff}
.ctrl button.on{border-color:#3fb950;background:#1a2e1a;color:#3fb950}
.ctrl button.err.on{border-color:#f85149;background:#2d1517;color:#f85149}
.ctrl .sep{border:none;border-top:1px solid #30363d;margin:3px 0}
body.light .ctrl .sep{border-color:#d0d7de}
.ctrl .section-label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.ctrl button.demo-btn{border-color:#d2a8ff;color:#d2a8ff}
.ctrl button.reset-btn{border-color:#f0883e;color:#f0883e}

/* Theme toggle */
.theme-toggle{position:fixed;top:16px;right:16px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

/* Steps sidebar */
.steps-panel{top:60px;right:16px;width:380px;max-height:40%;overflow-y:auto;padding:14px 16px}
.steps-title{font-weight:700;margin-bottom:8px;font-size:14px}
.step{margin:3px 0;color:#8b949e;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.5;transition:all .2s;cursor:pointer;padding:3px 4px;border-radius:4px}
body.light .step{color:#656d76}
.step:hover{background:#1a233244}
body.light .step:hover{background:#ddf4ff44}
.step-marker{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.active{color:#58a6ff}.step.active .step-marker::before{content:'\25CF'}
.step.done{color:#3fb950}.step.done .step-marker::before{content:'\2713'}
.step.fail{color:#f85149}.step.fail .step-marker::before{content:'\2717'}
.step .step-marker::before{content:'\25CB'}

/* Request Inspector */
.inspector{bottom:16px;right:16px;width:380px;height:380px;overflow:hidden;padding:14px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;display:flex;flex-direction:column}
.inspector-title{font-weight:700;font-size:13px;margin-bottom:8px;font-family:-apple-system,sans-serif;flex-shrink:0}
.inspector-scroll{overflow-y:auto;flex:1}
.inspector-section{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:11px;font-family:-apple-system,sans-serif}
.inspector-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6}
.inspector-line.add{background:#1a2e1a;color:#3fb950;border-left:3px solid #3fb950}
body.light .inspector-line.add{background:#dafbe1;color:#116329}
.inspector-line.del{background:#2d1517;color:#f85149;text-decoration:line-through;opacity:.7;border-left:3px solid #f85149}
body.light .inspector-line.del{background:#ffebe9;color:#82071e}
.inspector-line.keep{color:#8b949e;border-left:3px solid transparent}
.inspector-line.highlight{background:#1a2332;color:#58a6ff;border-left:3px solid #58a6ff;animation:pulse .8s ease-in-out}
body.light .inspector-line.highlight{background:#ddf4ff;color:#0969da}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:1}}
.inspector-plugin{margin:8px 0 4px;padding:4px 8px;background:#d2a8ff22;border-radius:4px;color:#d2a8ff;font-weight:600;font-size:11px;font-family:-apple-system,sans-serif}
body.light .inspector-plugin{background:#8250df15;color:#8250df}

/* Title */
.main-title{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:150;font-size:26px;font-weight:800;background:linear-gradient(90deg,#58a6ff,#d2a8ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.5px;white-space:nowrap}

/* Legend */
.legend{bottom:16px;left:16px;padding:10px 14px}
.legend-title{font-weight:600;margin-bottom:5px;font-size:13px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.legend-dot{width:11px;height:11px;border-radius:50%}

/* Scrollbar */
.steps-panel::-webkit-scrollbar,.inspector-scroll::-webkit-scrollbar{width:6px}
.steps-panel::-webkit-scrollbar-track,.inspector-scroll::-webkit-scrollbar-track{background:transparent}
.steps-panel::-webkit-scrollbar-thumb,.inspector-scroll::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-panel::-webkit-scrollbar-thumb,body.light .inspector-scroll::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>

<div class="panel panel-bg ctrl" id="ctrl-panel">
<div class="ctrl-header" onclick="toggleCtrl()">
  <div class="ctrl-title">Flows</div>
  <div class="ctrl-chevron">&#9660;</div>
</div>
<button onclick="run('ext')" id="b-ext">External Model (Anthropic)</button>
<button onclick="run('inc')" id="b-inc">On-Cluster (vLLM / llm-d)</button>
<hr class="sep"><div class="section-label">Error Scenarios</div>
<button class="err" onclick="run('af')" id="b-af">Auth Failure (401)</button>
<button class="err" onclick="run('rl')" id="b-rl">Rate Limit (429)</button>
<button class="err" onclick="run('pe')" id="b-pe">Provider Error (500)</button>
<button class="err" onclick="run('mn')" id="b-mn">Model Not Found (404)</button>
<hr class="sep">
<button class="demo-btn" onclick="demo()" id="b-demo">&#9654; Demo Mode</button>
<button class="reset-btn" onclick="doReset()">Reset</button>
</div>

<button class="theme-toggle" id="thm" onclick="toggleTheme()">&#9790;</button>

<div class="panel panel-bg legend">
<div class="legend-title">Legend</div>
<div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
<div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
<div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>Error</div>
<div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Auth / Rate Limit</div>
<div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Payload Processor</div>
</div>

<div class="panel panel-bg steps-panel" id="steps-panel">
<div class="steps-title">Flow Steps</div>
<div id="steps-container"><div style="color:#8b949e">Select a flow to begin</div></div>
</div>

<div class="panel panel-bg inspector" id="inspector">
<div class="inspector-title">Request Inspector -- Anthropic Translation</div>
<div class="inspector-scroll" id="inspector-scroll">
<div id="inspector-content"><div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:12px">Run "External Model" flow to see request mutations</div></div>
</div>
</div>

<div class="main-title">AI Inference Gateway — Flow Visualizer</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, isDark = true, animFrame = null, particles = [], activeNodes = new Set();
let badgeNodes = {}, failNode = null, persistentLines = [], running = false;
let currentFlowId = null, glowingContainers = new Set(), collapseTimer = null, fadingNodes = {};

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('thm').innerHTML = isDark ? '&#9790;' : '&#9788;';
  draw();
}

function toggleCtrl() {
  document.getElementById('ctrl-panel').classList.toggle('collapsed');
}

const LW = 1600, LH = 1000;
let offsetX = 0, offsetY = 0, scale = 1;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  scale = Math.min(W / LW, H / LH, 0.92);
  offsetX = (W - LW * scale) / 2;
  offsetY = (H - LH * scale) / 2;
  draw();
}
addEventListener('resize', resize);

function tx(x) { return offsetX + x * scale; }
function ty(y) { return offsetY + y * scale; }
function ts(s) { return s * scale; }

// ================================================================
// NODE DEFINITIONS
// ================================================================
const N = {
  user: { x: 470, y: 30, w: 60, h: 45, label: 'User', type: 'icon' },

  cluster: { x: 60, y: 100, w: 1200, h: 810, type: 'boundary' },

  aigw_boundary: { x: 200, y: 130, w: 950, h: 580, type: 'container', label: 'AI Inference Gateway', color: '#58a6ff' },

  gw: { x: 320, y: 280, w: 260, h: 85, label: 'Istio Gateway', sublabel: '(Envoy)', color: '#58a6ff', fs: 16 },

  wasm_boundary: { x: 720, y: 120, w: 380, h: 210, type: 'container', label: 'Kuadrant Wasm Shim (inside Envoy)', color: '#f0883e' },
  wasm_entry: { x: 710, y: 225, w: 10, h: 10, type: 'hidden' },
  authorino: { x: 750, y: 165, w: 320, h: 50, label: 'Auth', sublabel: '(Authorino)', color: '#f0883e', fs: 13, inner: true },
  limitador: { x: 750, y: 240, w: 320, h: 50, label: 'Rate Limit', sublabel: '(Limitador)', color: '#f0883e', fs: 13, inner: true },

  maas_api: { x: 1160, y: 90, w: 180, h: 55, label: 'MaaS API', sublabel: 'API key validation', color: '#79c0ff', fs: 13 },

  ipp_boundary: { x: 720, y: 370, w: 380, h: 310, type: 'container', label: 'Payload Processor (ext_proc)', color: '#d2a8ff' },
  ipp_entry: { x: 710, y: 530, w: 10, h: 10, type: 'hidden' },
  // Plugins in execution order (top to bottom)
  p_bfth: { x: 750, y: 415, w: 320, h: 34, label: 'body-field-to-header', sublabel: 'extract model → header', color: '#d2a8ff', type: 'plugin', inner: true },
  p_mpr: { x: 750, y: 455, w: 320, h: 34, label: 'model-provider-resolver', sublabel: 'lookup ExternalModel CRD (reconciler)', color: '#d2a8ff', type: 'plugin', inner: true },
  p_at: { x: 750, y: 495, w: 320, h: 34, label: 'api-translation', sublabel: 'request: OpenAI → provider · response: provider → OpenAI', color: '#d2a8ff', type: 'plugin', inner: true },
  p_aki: { x: 750, y: 535, w: 320, h: 34, label: 'apikey-injection', sublabel: 'inject provider credential from Secret', color: '#d2a8ff', type: 'plugin', inner: true },
  p_reqg: { x: 750, y: 575, w: 320, h: 34, label: 'request-guard', sublabel: 'safety filter — request (nemo)', color: '#d2a8ff', type: 'plugin', inner: true },
  p_rg: { x: 750, y: 615, w: 320, h: 34, label: 'response-guard', sublabel: 'safety filter — response (nemo)', color: '#d2a8ff', type: 'plugin', inner: true },

  // Five external model providers -- OUTSIDE cluster boundary
  openai: { x: 80, y: 620, w: 120, h: 55, label: 'OpenAI', sublabel: 'gpt-4o-mini', color: '#3fb950', fs: 12 },
  anthropic: { x: 210, y: 620, w: 120, h: 55, label: 'Anthropic', sublabel: 'claude-haiku-4-5', color: '#3fb950', fs: 12 },
  azure: { x: 80, y: 690, w: 120, h: 55, label: 'Azure OpenAI', sublabel: 'gpt-4.1-mini', color: '#3fb950', fs: 12 },
  bedrock: { x: 210, y: 690, w: 120, h: 55, label: 'Bedrock', sublabel: 'claude-3-haiku', color: '#3fb950', fs: 12 },
  vertex: { x: 145, y: 760, w: 120, h: 55, label: 'Vertex AI', sublabel: 'gemini-2.5-flash', color: '#3fb950', fs: 12 },

  sched: { x: 370, y: 640, w: 170, h: 55, label: 'llm-d Scheduler', sublabel: '(EPP)', color: '#79c0ff', fs: 13 },

  pool: { x: 310, y: 740, w: 420, h: 95, type: 'boundary', label: 'InferencePool' },
  vllm: { x: 340, y: 770, w: 110, h: 45, label: 'vLLM', color: '#8b949e', fs: 13 },
  triton: { x: 470, y: 770, w: 110, h: 45, label: 'Triton', color: '#8b949e', fs: 13 },
  sglang: { x: 600, y: 770, w: 110, h: 45, label: 'SGLang', color: '#8b949e', fs: 13 },
};

// ================================================================
// COLORS
// ================================================================
function colors() {
  return isDark
    ? { bg: '#0d1117', box: '#161b22', boxActive: '#1a2332', border: '#30363d', text: '#c9d1d9', dim: '#8b949e', bright: '#fff' }
    : { bg: '#fff', box: '#f6f8fa', boxActive: '#ddf4ff', border: '#d0d7de', text: '#24292f', dim: '#656d76', bright: '#000' };
}

// ================================================================
// DRAWING
// ================================================================
function drawBox(key) {
  const n = N[key], c = colors();
  if (!n || n.type === 'boundary' || n.type === 'container' || n.type === 'hidden') return;
  const isActive = activeNodes.has(key), isFail = failNode === key;
  const hasBadge = badgeNodes[key] != null;
  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h);
  ctx.save();

  if (n.type === 'icon') {
    ctx.font = `${ts(32)}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('👤', x + w / 2, y + ts(26));
    ctx.font = `bold ${ts(14)}px system-ui`;
    ctx.fillStyle = c.text;
    ctx.fillText(n.label, x + w / 2, y + ts(44));
    ctx.restore();
    return;
  }

  // Fade-in glow for lightup nodes
  let fadeAlpha = 1;
  if (fadingNodes[key]) {
    const elapsed = Date.now() - fadingNodes[key];
    fadeAlpha = Math.min(elapsed / 500, 1); // 500ms fade-in
    if (elapsed > 500) delete fadingNodes[key];
  }

  if (isActive || hasBadge) {
    ctx.shadowColor = isFail ? '#f85149' : n.color;
    ctx.shadowBlur = ts(18) * fadeAlpha;
    ctx.globalAlpha = 0.3 + 0.7 * fadeAlpha;
  }

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, ts(8));
  ctx.fillStyle = isFail ? '#2d1517' : ((isActive || hasBadge) ? c.boxActive : c.box);
  ctx.fill();
  ctx.strokeStyle = isFail ? '#f85149' : ((isActive || hasBadge) ? n.color : c.border);
  ctx.lineWidth = ts(isFail || isActive || hasBadge ? 2.5 : 1.5);
  if (n.type === 'plugin') { ctx.setLineDash([ts(5), ts(4)]); }
  ctx.stroke();
  ctx.setLineDash([]);

  const fontSize = n.fs || 12;
  ctx.fillStyle = isFail ? '#f85149' : c.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (n.sublabel) {
    ctx.font = `bold ${ts(fontSize)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2 - ts(8));
    ctx.font = `${ts(fontSize - 3)}px system-ui`;
    ctx.fillStyle = isFail ? '#f8514999' : c.dim;
    ctx.fillText(n.sublabel, x + w / 2, y + h / 2 + ts(7));
  } else {
    ctx.font = `bold ${ts(fontSize)}px system-ui`;
    ctx.fillText(n.label, x + w / 2, y + h / 2);
  }

  // Step badge inside box (top-left corner, 16px circle)
  if (hasBadge) {
    const bx = x + ts(8), by = y + ts(8), br = ts(8);
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(bx + br, by + br, br, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();
    ctx.font = `bold ${ts(9)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(badgeNodes[key]), bx + br, by + br);
  }

  ctx.restore();
}

function drawContainerBorder(key, isGlowing) {
  const n = N[key], c = colors();
  if (!n || n.type !== 'container') return;
  ctx.save();
  if (isGlowing) {
    ctx.shadowColor = n.color;
    ctx.shadowBlur = ts(20);
  }
  ctx.beginPath();
  ctx.roundRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h), ts(10));
  const alpha = isGlowing ? 'cc' : '55';
  ctx.strokeStyle = (isDark ? n.color : n.color) + alpha;
  ctx.lineWidth = ts(isGlowing ? 3 : 2);
  ctx.setLineDash([ts(6), ts(5)]);
  ctx.stroke();
  ctx.setLineDash([]);
  // Label
  ctx.font = `bold ${ts(11)}px system-ui`;
  ctx.fillStyle = n.color + (isDark ? 'aa' : '99');
  ctx.textAlign = 'left';
  ctx.fillText(n.label, tx(n.x + 12), ty(n.y + 16));
  ctx.restore();
}

function drawBoundaries() {
  const c = colors();

  // Cluster boundary
  const cb = N.cluster;
  ctx.beginPath();
  ctx.roundRect(tx(cb.x), ty(cb.y), ts(cb.w), ts(cb.h), ts(14));
  ctx.strokeStyle = c.border;
  ctx.lineWidth = ts(2);
  ctx.setLineDash([ts(10), ts(8)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `${ts(13)}px system-ui`;
  ctx.fillStyle = isDark ? 'rgba(63,185,80,0.6)' : 'rgba(26,127,55,0.6)';
  ctx.textAlign = 'right';
  ctx.fillText('kubernetes cluster', tx(cb.x + cb.w - 15), ty(cb.y + cb.h - 15));

  // AI Inference Gateway boundary
  const aigw = N.aigw_boundary;
  ctx.beginPath();
  ctx.roundRect(tx(aigw.x), ty(aigw.y), ts(aigw.w), ts(aigw.h), ts(12));
  ctx.strokeStyle = isDark ? '#58a6ff44' : '#58a6ff33';
  ctx.lineWidth = ts(2);
  ctx.setLineDash([ts(8), ts(6)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `bold ${ts(13)}px system-ui`;
  ctx.fillStyle = isDark ? '#58a6ff88' : '#58a6ff77';
  ctx.textAlign = 'right';
  ctx.fillText(aigw.label, tx(aigw.x + aigw.w - 14), ty(aigw.y + aigw.h - 12));

  // Wasm container
  drawContainerBorder('wasm_boundary', glowingContainers.has('wasm_boundary'));
  // IPP container
  drawContainerBorder('ipp_boundary', glowingContainers.has('ipp_boundary'));

  // InferencePool
  const ip = N.pool;
  ctx.beginPath();
  ctx.roundRect(tx(ip.x), ty(ip.y), ts(ip.w), ts(ip.h), ts(10));
  ctx.strokeStyle = c.border;
  ctx.lineWidth = ts(1.5);
  ctx.setLineDash([ts(6), ts(5)]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `${ts(12)}px system-ui`;
  ctx.fillStyle = c.dim;
  ctx.textAlign = 'left';
  ctx.fillText(ip.label, tx(ip.x + 12), ty(ip.y + 16));
}

function edgePoint(n, targetX, targetY) {
  const cx_ = n.x + n.w / 2, cy_ = n.y + n.h / 2;
  const dx = targetX - cx_, dy = targetY - cy_;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < 1 && ay < 1) return { x: cx_, y: cy_ };
  const hw = n.w / 2, hh = n.h / 2;
  let ex, ey;
  if (ax * hh > ay * hw) {
    ex = cx_ + (dx > 0 ? hw : -hw);
    ey = cy_ + dy * (hw / ax);
  } else {
    ey = cy_ + (dy > 0 ? hh : -hh);
    ex = cx_ + dx * (hh / ay);
  }
  return { x: ex, y: ey };
}

function leftEdgePoint(n) {
  return { x: n.x, y: n.y + n.h / 2 };
}

function drawArrow(x1, y1, x2, y2, color, num, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.beginPath();
  ctx.moveTo(tx(x1), ty(y1));
  ctx.lineTo(tx(x2), ty(y2));
  ctx.strokeStyle = color;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();

  const angle = Math.atan2(y2 - y1, x2 - x1);
  const sz = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2) - sz * Math.cos(angle - 0.4), ty(y2) - sz * Math.sin(angle - 0.4));
  ctx.lineTo(tx(x2) - sz * Math.cos(angle + 0.4), ty(y2) - sz * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  if (num != null) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, r = ts(12);
    ctx.beginPath();
    ctx.arc(tx(mx), ty(my), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), tx(mx), ty(my));
  }
  ctx.restore();
}

function drawPersistentLines() {
  persistentLines.forEach(l => {
    const fn = N[l.from], tn = N[l.to];
    if (!fn || !tn) return;
    let fp, tp;
    if (l.toLeftEdge) {
      fp = edgePoint(fn, tn.x, tn.y + tn.h / 2);
      tp = leftEdgePoint(tn);
    } else {
      const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
      const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
      fp = edgePoint(fn, tc, tcy);
      tp = edgePoint(tn, fc, fy);
    }
    drawArrow(fp.x, fp.y, tp.x, tp.y, l.color, l.num, 0.8);
  });
}

// ================================================================
// ANIMATED DOT
// ================================================================
class AnimDot {
  constructor(fromKey, toKey, color, speed, callback, toLeftEdge) {
    this.fromKey = fromKey;
    this.toKey = toKey;
    this.color = color;
    this.speed = speed || 0.012;
    this.t = 0;
    this.callback = callback;
    this.alive = true;

    const fn = N[fromKey], tn = N[toKey];
    if (toLeftEdge) {
      this.fp = edgePoint(fn, tn.x, tn.y + tn.h / 2);
      this.tp = leftEdgePoint(tn);
    } else {
      const fc = fn.x + fn.w / 2, fy = fn.y + fn.h / 2;
      const tc = tn.x + tn.w / 2, tcy = tn.y + tn.h / 2;
      this.fp = edgePoint(fn, tc, tcy);
      this.tp = edgePoint(tn, fc, fy);
    }
  }

  update() {
    this.t += this.speed;
    if (this.t >= 1) {
      this.t = 1;
      this.alive = false;
      activeNodes.add(this.toKey);
      if (this.callback) this.callback();
    }
    this.x = this.fp.x + (this.tp.x - this.fp.x) * this.t;
    this.y = this.fp.y + (this.tp.y - this.fp.y) * this.t;
  }

  draw() {
    ctx.beginPath();
    ctx.moveTo(tx(this.fp.x), ty(this.fp.y));
    ctx.lineTo(tx(this.x), ty(this.y));
    ctx.strokeStyle = this.color;
    ctx.lineWidth = ts(2.5);
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(tx(this.x), ty(this.y), ts(6), 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = ts(14);
    ctx.fill();
    ctx.restore();
  }
}

// ================================================================
// MAIN DRAW LOOP
// ================================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBoundaries();
  drawPersistentLines();
  Object.keys(N).forEach(k => drawBox(k));
  particles.forEach(p => { p.update(); p.draw(); });
  particles = particles.filter(p => p.alive);
}

function animate() {
  draw();
  animFrame = requestAnimationFrame(animate);
}

// ================================================================
// REQUEST INSPECTOR
// ================================================================
function renderInspector(rqData) {
  if (!rqData) return;
  const container = document.getElementById('inspector-content');
  let html = '';
  html += `<div class="inspector-plugin">${esc(rqData.plugin)}</div>`;
  if (rqData.headers && rqData.headers.length > 0) {
    html += '<div class="inspector-section">Headers:</div>';
    rqData.headers.forEach(h => {
      html += `<div class="inspector-line ${h.s}">${esc(h.v)}</div>`;
    });
  }
  if (rqData.body && rqData.body.length > 0) {
    html += '<div class="inspector-section">Body:</div>';
    rqData.body.forEach(b => {
      html += `<div class="inspector-line ${b.s}">${esc(b.v)}</div>`;
    });
  }
  container.innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function scrollInspectorToStep(stepIndex) {
  if (!currentFlowId || currentFlowId !== 'ext') return;
  const flow = flows.ext;
  if (stepIndex < 0 || stepIndex >= flow.steps.length) return;
  const step = flow.steps[stepIndex];
  if (step.rq) renderInspector(step.rq);
  document.querySelectorAll('.step').forEach((s, i) => {
    s.style.background = i === stepIndex ? (isDark ? '#1a233266' : '#ddf4ff66') : '';
  });
}

// ================================================================
// FLOW EXECUTION
// ================================================================
function run(id) {
  if (running) return;
  doReset();
  running = true;
  currentFlowId = id;

  // Auto-collapse timer
  if (collapseTimer) clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => {
    document.getElementById('ctrl-panel').classList.add('collapsed');
  }, 60000);

  document.querySelectorAll('.ctrl button').forEach(b => b.classList.remove('on'));
  const btn = document.getElementById('b-' + id);
  if (btn) btn.classList.add('on');

  const flow = flows[id];
  const stepsContainer = document.getElementById('steps-container');
  stepsContainer.innerHTML = '';

  const inspector = document.getElementById('inspector');
  if (id === 'ext') {
    inspector.style.display = '';
    document.getElementById('inspector-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:12px">Flow starting...</div>';
  } else {
    inspector.style.display = 'none';
  }

  flow.steps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = 'step-' + i;
    div.innerHTML = `<span class="step-marker"></span><span>${esc(s.t)}</span>`;
    div.addEventListener('click', () => scrollInspectorToStep(i));
    stepsContainer.appendChild(div);
  });

  let stepIndex = 0;

  function nextStep() {
    if (stepIndex >= flow.steps.length) { running = false; return; }
    const s = flow.steps[stepIndex];
    const el = document.getElementById('step-' + stepIndex);
    el.className = 'step active';

    if (id === 'ext' && s.rq) renderInspector(s.rq);

    const currentStep = stepIndex;

    if (s.mode === 'arrow') {
      // Animated arrow between separate components
      if (s.f) activeNodes.add(s.f);
      particles.push(new AnimDot(s.f, s.to, s.c, 0.012, () => {
        persistentLines.push({ from: s.f, to: s.to, color: s.c, num: s.num, toLeftEdge: s.toLeftEdge });
        if (s.glowContainer) {
          glowingContainers.add(s.glowContainer);
          // Container stays lit for the rest of the flow
        }
        if (s.fail) {
          failNode = s.fail;
          el.className = 'step fail';
        } else {
          el.className = 'step done';
        }
        stepIndex++;
        setTimeout(nextStep, 500);
      }, s.toLeftEdge));
    } else if (s.mode === 'lightup') {
      // Inner component lights up with fade-in glow + badge
      fadingNodes[s.target] = Date.now();
      activeNodes.add(s.target);
      badgeNodes[s.target] = s.badge;
      if (s.fail) {
        failNode = s.fail;
        el.className = 'step fail';
      } else {
        el.className = 'step done';
      }
      stepIndex++;
      setTimeout(nextStep, 700);
    }
  }

  setTimeout(nextStep, 300);
  if (!animFrame) animate();
}

function doReset() {
  running = false;
  currentFlowId = null;
  particles = [];
  activeNodes.clear();
  badgeNodes = {};
  failNode = null;
  persistentLines = [];
  glowingContainers.clear();
  if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
  document.getElementById('ctrl-panel').classList.remove('collapsed');
  document.querySelectorAll('.ctrl button').forEach(b => b.classList.remove('on'));
  document.getElementById('steps-container').innerHTML = '<div style="color:#8b949e">Select a flow to begin</div>';
  document.getElementById('inspector-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:12px">Run "External Model" flow to see request mutations</div>';
  document.getElementById('inspector').style.display = '';
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  draw();
}

async function demo() {
  if (running) return;
  const flowIds = ['ext', 'inc', 'af', 'rl', 'pe', 'mn'];
  for (const id of flowIds) {
    run(id);
    await new Promise(resolve => {
      const check = () => running ? setTimeout(check, 200) : resolve();
      setTimeout(check, 500);
    });
    await new Promise(resolve => setTimeout(resolve, 3000));
    doReset();
    await new Promise(resolve => setTimeout(resolve, 500));
  }
}
